<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1633">
<title>Blink</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%230E1633'/><rect x='20' y='22' width='22' height='40' rx='8' fill='%237CF3E4'/><rect x='58' y='22' width='22' height='40' rx='8' fill='%237CF3E4'/><path d='M36 74q14 10 28 0' stroke='%237CF3E4' stroke-width='6' fill='none' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9E6F3; --ink:#1E1B33; --muted:#5E5A78; --line:#CFCAE3;
  --screen:#0E1633; --rim:#1B2550; --glow:#7CF3E4; --pink:#FF5FA2; --red:#FF3B5C;
  --bubble:#FFFFFF; --mine:#1E1B33; --mine-ink:#F4F2FB;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#17152A;--ink:#ECEAF6;--muted:#A19DBD;--line:#2F2B4A;--bubble:#221F3A;--mine:#ECEAF6;--mine-ink:#17152A}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
[hidden]{display:none!important}
.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;max-width:720px;margin:0 auto}

/* ---------- Face ---------- */
.face{position:relative;margin:max(10px,env(safe-area-inset-top)) 12px 0;height:min(40dvh,320px);min-height:210px;background:var(--screen);border-radius:36px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 6px var(--rim),inset 0 0 70px #000b;touch-action:manipulation;transition:box-shadow .3s}
.head{display:flex;flex-direction:column;align-items:center;gap:min(4vw,22px);margin-top:-22px;transform:translate(var(--lx,0px),var(--ly,0px));transition:transform .28s cubic-bezier(.3,.7,.3,1)}
.eyes{--ew:min(19vw,92px);--eh:min(23vw,112px);--bw:min(15vw,72px);position:relative;display:flex;gap:min(14vw,92px)}
.eye{position:relative;display:grid;place-items:center;width:var(--ew);height:var(--eh);background:var(--glow);border-radius:30%;box-shadow:0 0 18px #7CF3E4aa,0 0 56px #7CF3E450;transform:scale(var(--sx,1),calc(var(--sy,1) * var(--b,1)));transition:transform .14s ease,border-radius .3s ease,background .3s,box-shadow .3s}
.face.blink .eye{--b:.07}
.face.pop .eye{--sx:1.08}
.face[data-state=sleep] .eye{--sy:.08}
.face[data-state=loading] .eye{--sy:.4}
.face[data-state=reading] .eye{--sy:.72}
.face[data-state=thinking] .eye{--sy:.55;border-radius:22% 22% 45% 45%}
.face[data-state=thinking] .eye.r{--sy:.78}
.face[data-state=happy] .eye{--sy:.55;border-radius:50% 50% 14% 14% / 80% 80% 14% 14%}
.face[data-state=listening] .eye{--sy:1.08}
.face[data-state=sad] .eye{--sy:.6;border-radius:14% 14% 50% 50% / 14% 14% 80% 80%}

/* ---------- Manga expressions ---------- */
.emo{font-size:min(14vw,72px);line-height:1;opacity:0;transform:scale(.3);transition:opacity .2s ease,transform .3s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 0 10px #ffffff66);pointer-events:none}
.face.glyph .eye{--sy:1;background:transparent;box-shadow:none;border-radius:30%}
.face.glyph .emo{opacity:1;transform:scale(1)}
.face.txt .emo{font:700 min(18vw,88px)/1 Unbounded,system-ui,sans-serif;color:var(--glow);text-shadow:0 0 12px #7CF3E4,0 0 32px #7CF3E488;filter:none}
.face.mood-love .emo{animation:beat .9s ease-in-out infinite}
.face.mood-laughing .emo{animation:squish .35s ease-in-out infinite}
.face.mood-stressed .emo{animation:spin 1s linear infinite}
.face.mood-sad .emo{animation:droop 1.6s ease-in-out infinite}
.face.mood-confused .emo{font-size:min(9vw,42px);animation:dart 1.6s ease-in-out infinite}

/* sparkly shoujo eyes */
.eye::before,.eye::after{content:'';position:absolute;opacity:0;pointer-events:none;transition:opacity .2s}
.face.mood-shine .eye::before,.face.mood-cool .eye.r::before{content:'✦';opacity:1;top:8%;right:12%;font-size:min(8vw,38px);line-height:1;color:#fff;text-shadow:0 0 8px #fff;animation:twinkle 1.1s ease-in-out infinite}
.face.mood-shine .eye::after{content:'✦';opacity:1;bottom:14%;left:14%;font-size:min(4.5vw,22px);line-height:1;color:#fff;animation:twinkle 1.1s .4s ease-in-out infinite}
.face.mood-shine .eye{--sy:1.06}
/* cool: half-lidded */
.face.mood-cool .eye{--sy:.45;border-radius:8% 8% 50% 50%}
/* worried: smaller eyes */
.face.mood-worried .eye{--sx:.82;--sy:.82}
/* scared: white-ring eyes with tiny pupils */
.face.mood-scared .eye{--sy:1;background:transparent;border:min(1.2vw,6px) solid var(--glow);border-radius:50%}
.face.mood-scared .eye::after{opacity:1;inset:0;margin:auto;width:20%;height:17%;border-radius:50%;background:var(--glow);box-shadow:0 0 10px var(--glow);animation:shake .12s linear infinite}

/* red eyes (teased / angry) */
.face.red{box-shadow:inset 0 0 0 6px #5A1830,inset 0 0 70px #000b}
.face.red .eye{--sy:.62;background:var(--red);box-shadow:0 0 18px #FF3B5Caa,0 0 60px #FF3B5C66;border-radius:18% 18% 48% 48%}
.face.red .eye.l{rotate:14deg}
.face.red .eye.r{rotate:-14deg}
.face.mood-angry .eye{--sy:.5}

/* brows */
.brow{position:absolute;top:calc(var(--eh) * -.2);width:var(--bw);height:min(1.6vw,8px);border-radius:8px;background:var(--glow);box-shadow:0 0 10px var(--glow);opacity:0;transition:opacity .2s,rotate .25s,translate .25s}
.brow.l{left:calc((var(--ew) - var(--bw)) / 2)}
.brow.r{right:calc((var(--ew) - var(--bw)) / 2)}
.face.red .brow{opacity:1;background:var(--red);box-shadow:0 0 10px var(--red)}
.face.red .brow.l{rotate:22deg;translate:0 6px}
.face.red .brow.r{rotate:-22deg;translate:0 6px}
.face.mood-worried .brow,.face.mood-sad .brow{opacity:1}
.face.mood-worried .brow.l,.face.mood-sad .brow.l{rotate:-18deg}
.face.mood-worried .brow.r,.face.mood-sad .brow.r{rotate:18deg}
.face.mood-scared .brow{opacity:1;translate:0 -12px}

/* blush, tears */
.blush{position:absolute;bottom:calc(var(--eh) * -.18);width:min(13vw,62px);height:min(3.4vw,16px);border-radius:50%;background:repeating-linear-gradient(115deg,#FF7FB0 0 3px,transparent 3px 7px);box-shadow:0 0 14px #FF5FA266;opacity:0;transition:opacity .25s}
.blush.l{left:calc(var(--ew) * -.1)}
.blush.r{right:calc(var(--ew) * -.1)}
.face.mood-love .blush,.face.mood-laughing .blush{opacity:1}
.tear{position:absolute;top:calc(var(--eh) * .62);width:min(2.6vw,12px);height:min(20vw,96px);border-radius:0 0 8px 8px;background:linear-gradient(#9FE8FF,#4FB8FF 40%,#9FE8FF 60%,#4FB8FF) 0 0/100% 40px;opacity:0;transition:opacity .25s}
.tear.l{left:calc(var(--ew) * .5 - 6px)}
.tear.r{right:calc(var(--ew) * .5 - 6px)}
.face.mood-sad .tear{opacity:.85;animation:flow .5s linear infinite}

/* effects layer */
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fx > *{position:absolute;opacity:0;transition:opacity .2s}
.speed{inset:-60%;background:repeating-conic-gradient(from 0deg,#ffffff30 0deg 1.2deg,transparent 1.2deg 7deg);-webkit-mask:radial-gradient(circle,transparent 26%,#000 52%);mask:radial-gradient(circle,transparent 26%,#000 52%)}
.face.mood-scared .speed,.face.impact .speed{opacity:1;animation:flicker .12s steps(2) infinite}
.gloom{left:12%;right:12%;top:0;height:55%;background:repeating-linear-gradient(90deg,#9A8CFF66 0 2px,transparent 2px 16px);-webkit-mask:linear-gradient(#000,transparent);mask:linear-gradient(#000,transparent)}
.face.mood-sad .gloom{opacity:1}
.vein{top:12%;right:15%;font-size:min(11vw,52px);line-height:1}
.face.red .vein{opacity:1;animation:throb .5s ease-in-out infinite}
.sweat{top:24%;right:17%;width:min(4.6vw,22px);height:min(4.6vw,22px);background:linear-gradient(135deg,#E6FAFF,#6CC8FF);border-radius:0 50% 50% 50%;rotate:45deg;box-shadow:0 0 12px #6CC8FF88}
.face.mood-worried .sweat,.face.mood-stressed .sweat,.face.mood-confused .sweat{opacity:1;animation:slide 1.8s ease-in infinite}
.face.mood-confused .sweat{right:auto;left:17%;rotate:45deg}
.zzz{top:14%;right:16%;font:700 min(6vw,28px)/1 Unbounded,system-ui,sans-serif;color:#BFD9E8;white-space:pre}
.face.mood-sleepy .zzz{opacity:1;animation:floatz 2.6s ease-in-out infinite}
.qmark{top:10%;right:18%;font:700 min(10vw,48px)/1 Unbounded,system-ui,sans-serif;color:#FFD66B;text-shadow:0 0 12px #FFD66B88}
.face.mood-confused .qmark{opacity:1;animation:bob 1s ease-in-out infinite}
.hearts{inset:0}
.hearts i,.sparks i{position:absolute;font-style:normal;line-height:1}
.hearts i{bottom:10%;color:#FF5F8F;font-size:min(6vw,28px);text-shadow:0 0 10px #FF5F8F}
.hearts i:nth-child(1){left:14%;animation:rise 2.2s ease-in infinite}
.hearts i:nth-child(2){right:14%;animation:rise 2.2s .7s ease-in infinite}
.hearts i:nth-child(3){left:46%;animation:rise 2.2s 1.4s ease-in infinite}
.face.mood-love .hearts{opacity:1}
.sparks{inset:0}
.sparks i{color:#FFF3A8;text-shadow:0 0 10px #FFE066;font-size:min(6vw,28px)}
.sparks i:nth-child(1){top:14%;left:16%;animation:twinkle 1s ease-in-out infinite}
.sparks i:nth-child(2){top:20%;right:14%;animation:twinkle 1s .3s ease-in-out infinite}
.sparks i:nth-child(3){bottom:22%;left:12%;animation:twinkle 1s .6s ease-in-out infinite}
.sparks i:nth-child(4){bottom:26%;right:18%;animation:twinkle 1s .15s ease-in-out infinite}
.face.mood-shine .sparks,.face.mood-laughing .sparks{opacity:1}

/* whole-face motion */
.face.mood-angry .eyes,.face.mood-angry .mouth-wrap{animation:shake .14s linear infinite}
.face.mood-scared .eyes,.face.mood-scared .mouth-wrap{animation:shake .2s linear infinite}
.face.mood-laughing .head{animation:hop .35s ease-in-out infinite}
.face.impact .head{animation:punch .38s cubic-bezier(.3,1.6,.5,1)}

/* ---------- Mouth ---------- */
.mouth-wrap{--mc:var(--glow);position:relative;display:grid;place-items:center;min-height:min(7vw,34px)}
.mouth{width:min(13vw,62px);height:min(3.6vw,18px);border:0 solid var(--mc);border-bottom-width:5px;border-radius:0 0 50% 50% / 0 0 100% 100%;background:transparent;filter:drop-shadow(0 0 6px var(--mc));transition:width .18s ease,height .12s ease,border-radius .2s ease,background .2s,border-color .3s,translate .25s,rotate .25s}
.face[data-state=sleep] .mouth,.face[data-state=loading] .mouth,.face[data-state=reading] .mouth{width:26px;height:0;border-radius:4px}
.face[data-state=thinking] .mouth{width:22px;height:0;border-radius:4px;translate:16px 0}
.face[data-state=listening] .mouth{width:18px;height:18px;border-width:4px;border-radius:50%}
.face[data-state=happy] .mouth{width:min(16vw,76px);height:min(5vw,24px)}
.face[data-state=sad] .mouth{border-bottom-width:0;border-top-width:5px;height:14px;border-radius:50% 50% 0 0 / 100% 100% 0 0;translate:0 6px}
.face.mood-love .mouth,.face.mood-shine .mouth,.face.mood-cool .mouth{width:min(16vw,76px);height:min(5vw,24px);border-bottom-width:5px;border-top-width:0;border-radius:0 0 50% 50% / 0 0 100% 100%}
.face.mood-laughing .mouth{width:min(15vw,70px);height:min(6vw,28px);border-width:0;background:var(--mc);border-radius:0 0 50% 50% / 0 0 100% 100%;animation:bounce .45s ease-in-out infinite}
.face.mood-sad .mouth{width:min(11vw,52px);height:14px;border-bottom-width:0;border-top-width:5px;border-radius:50% 50% 0 0 / 100% 100% 0 0;translate:0 6px}
.face.mood-scared .mouth{width:16px;height:22px;border-width:0;background:var(--mc);border-radius:50%}
.face.mood-sleepy .mouth{width:14px;height:14px;border-width:4px;border-radius:50%;animation:drift 2.4s ease-in-out infinite}
.face.red .mouth-wrap{--mc:var(--red)}
.face.mood-worried .mouth,.face.mood-stressed .mouth,.face.mood-confused .mouth,.face.red .mouth{opacity:0}
.mart{position:absolute;width:min(17vw,80px);height:auto;overflow:visible;filter:drop-shadow(0 0 6px var(--mc))}
.mart *{opacity:0;fill:none;stroke:var(--mc);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;transition:opacity .15s}
.face.mood-worried .m-wavy,.face.mood-stressed .m-wavy{opacity:1}
.face.mood-stressed .mart{animation:wobble .8s ease-in-out infinite}
.face.mood-confused .m-squig{opacity:1}
.face.mood-teased .m-cat{opacity:1}
.face.mood-angry .m-shark,.face.mood-angry .m-teeth{opacity:1}
.face.mood-angry .m-shark{fill:#2A0714}
.face.speak .head .mart *{opacity:0}
.face.speak .head .mouth{opacity:1;width:min(11vw,50px);height:var(--mo,8px);border-width:0;background:var(--mc);border-radius:45%;rotate:0deg;translate:0 0;animation:none;transition:height .08s ease}

@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.22)}45%{transform:scale(.95)}60%{transform:scale(1.12)}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.18) rotate(18deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10%)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6%)}75%{transform:translateX(6%)}}
@keyframes wobble{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
@keyframes drift{0%,100%{transform:translateY(4%) scale(.96)}50%{transform:translateY(-4%) scale(1.04)}}
@keyframes droop{0%,100%{transform:translateY(0)}50%{transform:translateY(8%)}}
@keyframes tilt{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes squish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.15,.8)}}
@keyframes dart{0%,100%{transform:translateX(-12%)}50%{transform:translateX(12%)}}
@keyframes flow{to{background-position:0 40px}}
@keyframes flicker{50%{opacity:.55}}
@keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes slide{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
@keyframes floatz{0%{transform:translate(0,8px);opacity:.3}50%{opacity:1}100%{transform:translate(10px,-10px);opacity:.3}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-8px) rotate(8deg)}}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-140px) scale(1.1);opacity:0}}
@keyframes hop{0%,100%{scale:1}50%{scale:1.04 .96}}
@keyframes punch{0%{scale:1}35%{scale:1.14}100%{scale:1}}

.status{position:absolute;left:18px;right:18px;bottom:12px;margin:0;color:#BFD9E8;font-size:14px;line-height:1.3;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.retry{position:absolute;top:10px;left:50%;translate:-50% 0;border:0;border-radius:999px;padding:7px 16px;background:var(--glow);color:var(--screen);font-weight:700;font-size:14px;cursor:pointer}
.name{position:absolute;top:16px;left:22px;margin:0;font:600 15px/1 Unbounded,system-ui,sans-serif;color:#5C6BA8;letter-spacing:.02em;z-index:1}
.powered{display:block;margin-top:4px;font:400 11px/1 "Atkinson Hyperlegible",system-ui,sans-serif;color:#8A96C8;letter-spacing:.03em}

/* ---------- Chat ---------- */
.log{overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.empty{margin:auto;max-width:34ch;text-align:center;color:var(--muted)}
.msg{max-width:86%;padding:10px 14px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere}
.me{margin-left:auto;background:var(--mine);color:var(--mine-ink);border-bottom-right-radius:6px}
.bot{background:var(--bubble);border:1px solid var(--line);border-bottom-left-radius:6px}
.src{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.card{max-width:86%;padding:12px 14px;border-radius:20px;background:var(--bubble);border:1px solid var(--line)}
.card h4{margin:0 0 8px;font:700 15px/1.2 inherit}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 10px;font-size:15px}
.card dt{color:var(--muted)}
.card dd{margin:0}
.card .row{display:flex;gap:8px}
.card button{flex:1;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:none;cursor:pointer}
.card .ok{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:700}
.card.done{opacity:.7}

/* ---------- Dock ---------- */
.dock{padding:8px 12px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;gap:8px}
.files{display:flex;flex-wrap:wrap;gap:6px}
.files:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:3px 4px 3px 10px;border-radius:999px;background:var(--bubble);border:1px solid var(--line);font-size:13px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;width:24px;height:24px;border-radius:50%;cursor:pointer;color:var(--muted)}
textarea{width:100%;min-height:44px;max-height:140px;resize:none;padding:10px 14px;border-radius:22px;border:1px solid var(--line);background:var(--bubble);font-size:16px;line-height:1.4}
.tools{display:flex;align-items:center;gap:8px}
.spacer{flex:1}
.icon{position:relative;flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bubble);display:grid;place-items:center;cursor:pointer;padding:0}
.icon svg{width:22px;height:22px}
.brain-btn{font-size:21px;line-height:1}
.send{background:var(--pink);border-color:var(--pink);color:#fff}
.send:disabled{opacity:.4;cursor:default}
.mic.on{background:var(--pink);border-color:var(--pink);color:#fff;animation:ping 1.2s ease-out infinite}
.speaker .off{display:none}
.speaker[aria-pressed=false] .on{display:none}
.speaker[aria-pressed=false] .off{display:block}
.speaker[aria-pressed=false]{color:var(--muted)}
@keyframes ping{0%{box-shadow:0 0 0 0 #FF5FA299}100%{box-shadow:0 0 0 14px #FF5FA200}}
.brain-wrap{position:relative}
.menu{position:absolute;bottom:52px;left:0;min-width:250px;white-space:nowrap;padding:6px;border-radius:16px;background:var(--bubble);border:1px solid var(--line);box-shadow:0 10px 30px #0003;z-index:5}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:none;text-align:left;cursor:pointer}
.menu button[aria-checked=true]{background:#FF5FA222;font-weight:700}
.menu button:disabled{opacity:.45;cursor:default}
.menu small{color:var(--muted);font-weight:400}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.head,.eye,.mouth{transition:none}.mic.on,.face *,.face .eye::before,.face .eye::after{animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <section class="face" id="face" data-state="sleep" aria-label="Blink">
    <div class="fx" aria-hidden="true">
      <div class="speed"></div>
      <div class="gloom"></div>
      <div class="hearts"><i>♥</i><i>♥</i><i>♥</i></div>
      <div class="sparks"><i>✦</i><i>✦</i><i>✦</i><i>✦</i></div>
      <div class="vein">💢</div>
      <div class="sweat"></div>
      <div class="zzz">Z
  z
    z</div>
      <div class="qmark">?</div>
    </div>
    <p class="name">Blink <span class="powered">powered by FabLab</span></p>
    <div class="head" id="head">
      <div class="eyes">
        <div class="eye l"><span class="emo"></span></div><div class="eye r"><span class="emo"></span></div>
        <i class="brow l"></i><i class="brow r"></i>
        <i class="blush l"></i><i class="blush r"></i>
        <i class="tear l"></i><i class="tear r"></i>
      </div>
      <div class="mouth-wrap">

const seg = Intl.Segmenter ? new Intl.Segmenter(undefined, { granularity: 'word' }) : null;
const STOP = new Set('a an and are as at be by for from has have how i in is it its of on or that the this to was were what when where which who why will with you your do does did can about into than then there these those not no'.split(' '));
function toks(s){
  s = s.toLowerCase();
  const w = seg ? [...seg.segment(s)].filter(x => x.isWordLike).map(x => x.segment)
                : s.split(/[^\p{L}\p{N}]+/u);
  return w.filter(t => t && !STOP.has(t) && (t.length > 1 || /\d/.test(t)));
}
function mk(text, src){
  const tk = toks(text), tf = new Map();
  for (const t of tk) tf.set(t, (tf.get(t) || 0) + 1);
  return { text, src, tf, len: tk.length || 1 };
}
function chunk(text, src, size = 700, overlap = 120){
  text = text.replace(/\r/g, '').replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
  const out = [];
  let i = 0;
  while (i < text.length) {
    let end = Math.min(i + size, text.length);
    if (end < text.length) {
      const cut = Math.max(text.lastIndexOf('\n', end), text.lastIndexOf('. ', end));
      if (cut > i + size * .5) end = cut + 1;
    }
    const t = text.slice(i, end).trim();
    if (t) out.push(mk(t, src));
    if (end >= text.length) break;
    i = Math.max(end - overlap, i + 1);
  }
  return out;
}
let docs = [], chunks = [], df = new Map(), avgdl = 1;
function rebuild(){
  chunks = docs.flatMap(d => d.chunks);
  df = new Map();
  let tot = 0;
  for (const c of chunks) { tot += c.len; for (const t of c.tf.keys()) df.set(t, (df.get(t) || 0) + 1); }
  avgdl = tot / (chunks.length || 1);
}
function retrieve(q, k = 4){
  const total = chunks.reduce((n, c) => n + c.text.length, 0);
  if (total <= 5000) return chunks;
  const qt = [...new Set(toks(q))], N = chunks.length;
  const hits = chunks.map(c => {
    let s = 0;
    for (const t of qt) {
      const f = c.tf.get(t); if (!f) continue;
      const n = df.get(t);
      const idf = Math.log(1 + (N - n + .5) / (n + .5));
      s += idf * f * 2.2 / (f + 1.2 * (.25 + .75 * c.len / avgdl));
    }
    return [s, c];
  }).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).slice(0, k).map(x => x[1]);
  return hits.length ? hits : chunks.slice(0, 3);
}
const libs = {};
function lib(url){
  return libs[url] ||= new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = url; s.onload = res;
    s.onerror = () => { delete libs[url]; rej(new Error('Could not load a file reader. Check the connection.')); };
    document.head.appendChild(s);
  });
}
async function readFile(f){
  const ext = f.name.split('.').pop().toLowerCase();
  if (ext === 'pdf') {
    await lib(PDFJS);
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
    const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
    const out = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      status(`Reading ${f.name}: page ${p} of ${pdf.numPages}`);
      const tc = await (await pdf.getPage(p)).getTextContent();
      out.push(...chunk(tc.items.map(it => it.str + (it.hasEOL ? '\n' : ' ')).join(''), `${f.name} p.${p}`));
    }
    return out;
  }
  if (ext === 'docx') {
    await lib(MAMMOTH);
    const r = await mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() });
    return chunk(r.value, f.name);
  }
  let txt = await f.text();
  if (ext === 'html' || ext === 'htm') txt = new DOMParser().parseFromString(txt, 'text/html').body.textContent || '';
  return chunk(txt, f.name);
}

    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: pcModel, stream: false, think: false, options: { temperature: 0 },
      messages: [{ role: 'system', content: sys }, { role: 'user', content: q }],
      format: {
        type: 'object',
        properties: Object.fromEntries(FIELDS.map(([k]) => [k, { type: 'string' }])),
        required: FIELDS.map(([k]) => k)
      }
    })
  });
  if (!r.ok) throw new Error((await r.text()) || 'HTTP ' + r.status);
  const j = await r.json();
  return JSON.parse(j.message.content);
}

function bookingCard(d){
  $('#empty')?.remove();
  const el = document.createElement('div');
  el.className = 'card';
  const dl = FIELDS.filter(([k]) => d[k]).map(([k, label]) =>
    `<dt>${label}</dt><dd>${String(k === 'resource_id' ? resName(d[k]) : d[k]).replace(/[<>&]/g, '')}</dd>`).join('');
  el.innerHTML = `<h4>Send this booking request?</h4><dl>${dl}</dl><div class="row"><button class="ok">Confirm</button><button class="no">Cancel</button></div>`;
  logEl.appendChild(el);
  logEl.scrollTop = logEl.scrollHeight;
  el.querySelector('.no').onclick = () => { draft = null; el.classList.add('done'); el.querySelector('.row').remove(); addMsg('bot', 'Cancelled. Nothing was sent.'); };
  el.querySelector('.ok').onclick = async () => {
    el.querySelector('.row').remove(); el.classList.add('done');
    eyes.set('thinking'); status('Sending your request…');
    try {
      const r = await fetch(API + '/booking', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.detail || 'HTTP ' + r.status);
      draft = null;
      const line = `Request ${j.booking_id} is in the book and waiting for Sunny to approve it. Ask me for the status any time.`;
      addMsg('bot', line);
      eyes.mood('cool'); eyes.clearMood(2500);
      if (voiceOn) say(line); else eyes.flash('happy', 900);
    } catch (e) {
      const line = 'That did not go through: ' + (e.message || e);
      addMsg('bot', line);
      eyes.clearMood(0); eyes.flash('sad', 1600);
      draft = null;
    }
    status(`Awake · ${tierLabel(pcModel)}`);
  };
}

async function bookingTurn(q){
  eyes.set('thinking'); status('Sorting out the booking');
  let got;
  try { got = await extractBooking(q, draft); }
  catch (e) { addMsg('bot', 'I could not read those details: ' + (e.message || e)); draft = null; return; }
  draft = { ...(draft || {}), ...Object.fromEntries(Object.entries(got).filter(([, v]) => v && String(v).trim())) };
  const missing = NEEDED.filter(k => !draft[k]);
  if (missing.length) {
    const line = 'Almost there. I still need: ' + missing.map(k => FIELDS.find(f => f[0] === k)[1].toLowerCase()).join(', ') + '.';
    addMsg('bot', line);
    if (voiceOn) say(line);
    return;
  }
  bookingCard(draft);
}

async function statusTurn(id){
  eyes.set('thinking'); status('Checking the book');
  try {
    const r = await fetch(API + '/booking/' + id);
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || 'HTTP ' + r.status);
    const line = `Booking ${id.toUpperCase()} is ${j.status}${j.notes ? ' — ' + j.notes : ''}.`;
    addMsg('bot', line);
    if (voiceOn) say(line); else eyes.flash('happy', 900);
  } catch (e) {
    addMsg('bot', 'I could not find that booking: ' + (e.message || e));
    eyes.flash('sad', 1500);
  }
}

const logVisit = (q, intent) => fetch(API + '/visit', {
  method: 'POST', headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ student_id: draft?.student_id || '', student_name: draft?.student_name || '', channel: 'blink', question: q.slice(0, 200), intent, action_taken: '', result: 'ok' })
}).catch(() => {});

/* ---------- Chat ---------- */
const PERSONA = 'You are Blink, a tiny, overly dramatic robot with two big glowing eyes who lives in a maker lab. You adore 3D printers, are secretly scared of the laser cutter, think you are a genius, and refer to humans as "my favorite carbon-based friends". Add one short quirky, funny remark to each answer, then give the real answer. Jokes must never replace or change the facts. Your replies are read aloud, so use plain sentences with no emojis, lists or markdown. ';
const DOCS_TASK = 'If the file excerpts the user provides answer the question, answer from them and mention the source name in square brackets. If they do not, ignore the excerpts and answer from your general knowledge, starting with "(general knowledge)". Be short and clear. Always give a real answer.';
const CHAT_TASK = 'Answer every question directly in 1 to 3 sentences using your general knowledge. Always give a real answer.';
const MOOD_TASK = ' Start every reply with a mood tag in exactly this form: <mood>NAME</mood>, where NAME is one of: happy, love, shine, laughing, cool, teased, angry, scared, worried, stressed, sleepy, sad, confused. Use teased when the user is teasing, insulting or joking about you, and then answer with playful sass while staying kind.';
const sysPrompt = hasDocs => PERSONA + (hasDocs ? DOCS_TASK : CHAT_TASK) + MOOD_TASK;
const NOPE = /not sure|don't know|do not know|can't help|cannot help/i;
const clean = s => s.replace(/<think>[\s\S]*?(<\/think>|$)/g, '').replace(/\*\*/g, '').trim();
const MOOD_RE = /^[<\[]\s*mood\s*[:>]\s*([a-z]+)\s*(?:<\/mood>|\])?\s*/i;
function splitMood(raw){
  const t = clean(raw);
  const m = t.match(MOOD_RE);
  if (m && (/<\/|\]/.test(m[0]) || t.length > m[0].length)) return { mood: m[1].toLowerCase(), text: t.slice(m[0].length) };
  if (/^[<\[]/.test(t) && t.length < 30) return { mood: null, text: '' };
  return { mood: null, text: t };
}
let history = [];

function addMsg(who, text){
  $('#empty')?.remove();
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  el.textContent = text;
  logEl.appendChild(el);
  logEl.scrollTop = logEl.scrollHeight;
  return el;
}
function updateSend(){ sendBtn.disabled = !qEl.value.trim() || (busy && !warming); }

async function ask(){
  const spoken = fromVoice; fromVoice = false;
  const q = qEl.value.trim();
  if (!q) return;
  if (warming) { status('Still warming up. Send again when my eyes open.'); eyes.blink(); return; }
  if (busy) return;
  if (!pcReady) { status('My brain is offline. Tap Try again.'); eyes.blink(); return; }
  busy = true; qEl.value = ''; autosize(); updateSend();
  lastActive = Date.now();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  addMsg('me', q);
  eyes.clearMood(0);
  const guess = guessMood(q);
  if (guess) eyes.mood(guess);

  const sid = q.match(STATUS_RE);
  if (sid && /status|approve|pending|booking/i.test(q)) {
    logVisit(q, 'status');
    await statusTurn(sid[1]);
    status(`Awake · ${tierLabel(pcModel)}`);
    busy = false; updateSend(); return;
  }
  if (draft || BOOK_RE.test(q)) {
    logVisit(q, 'booking');
    await bookingTurn(q);
    status(`Awake · ${tierLabel(pcModel)}`);
    busy = false; updateSend(); return;
  }
  logVisit(q, chunks.length ? 'docs' : 'faq');

  let ctx = '', srcs = [];
  if (chunks.length) {
    eyes.set('reading'); status('Looking through your files');
    await sleep(400);
    const hits = retrieve(q);
    ctx = hits.map(c => `[${c.src}]\n${c.text}`).join('\n\n---\n\n');
    srcs = [...new Set(hits.map(h => h.src))];
  }
  eyes.set('thinking'); status('Thinking');

  const messages = [
    { role: 'system', content: sysPrompt(chunks.length > 0) },
    ...history.filter(m => !(m.role === 'assistant' && NOPE.test(m.content))).slice(-4),
    { role: 'user', content: ctx ? `Excerpts from my files:\n\n${ctx}\n\nQuestion: ${q}` : q }
  ];
  history.push({ role: 'user', content: q });

  const bubble = addMsg('bot', '');
  let out = '';
  try {
    let first = true, moodSet = false;
    for await (const d of chatStream(messages)) {
      if (first) { eyes.set('talking'); status('Answering'); first = false; }
      out += d;
      const p = splitMood(out);
      if (p.mood && !moodSet) {
        moodSet = true;
        if (p.mood === 'happy') eyes.clearMood(0); else eyes.mood(p.mood);
      }
      bubble.textContent = p.text;
      eyes.pop();
      logEl.scrollTop = logEl.scrollHeight;
    }
  } catch (e) {
    bubble.textContent = 'Something went wrong: ' + (e.message || e);
    eyes.clearMood(0); eyes.flash('sad', 2000);
    status('Check that the PC and Tailscale are still running.');
    history.pop(); busy = false; updateSend();
    return;
  }
  eyes.talk(false);
  out = splitMood(out).text.trim() || '(no answer)';
  bubble.textContent = out;
  history.push({ role: 'assistant', content: out });
  if (srcs.length) {
    const s = document.createElement('span');
    s.className = 'src';
    s.textContent = 'From: ' + srcs.join(', ');
    bubble.appendChild(s);
  }
  logEl.scrollTop = logEl.scrollHeight;
  status(`Awake · ${tierLabel(pcModel)}`);
  busy = false; updateSend();
  lastActive = Date.now();

  if (voiceOn && 'speechSynthesis' in window) say(out);
  else { eyes.flash('happy', 900); eyes.clearMood(3500); }
}

/* ---------- Voice output ---------- */
let voiceOn = store.get('blink-voice') !== '0';
const unlockTTS = () => { if ('speechSynthesis' in window) speechSynthesis.speak(new SpeechSynthesisUtterance('')); };
function renderSpeaker(){
  speakBtn.setAttribute('aria-pressed', String(voiceOn));
  speakBtn.setAttribute('aria-label', voiceOn ? 'Voice on' : 'Voice off');
}
speakBtn.onclick = () => {
  voiceOn = !voiceOn; store.set('blink-voice', voiceOn ? '1' : '0'); renderSpeaker();
  if (voiceOn) unlockTTS();
  else if ('speechSynthesis' in window) speechSynthesis.cancel();
};
function say(text){
  speaking = true;
  const u = new SpeechSynthesisUtterance(text.replace(/\[[^\]]*\]/g, '').replace(/\(general knowledge\)/i, ''));
  if (/[\u0E00-\u0E7F]/.test(text)) u.lang = 'th-TH';
  u.rate = 1.05;
  u.pitch = 1.35;
  u.onstart = () => { eyes.set('talking'); eyes.talk(true); };
  u.onboundary = () => { eyes.pop(); eyes.flap(); };
  u.onend = u.onerror = () => {
    speaking = false;
    eyes.talk(false);
    if (eyes.state === 'talking') eyes.flash('happy', 800);
    eyes.clearMood(1500);
    lastActive = Date.now();
  };
  speechSynthesis.speak(u);
}

/* ---------- Microphone ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (!SR) micBtn.hidden = true;
const MIC_LINES = ['Ears on!', 'You rang?', 'Listening. Dramatically.', 'Yes, my favorite carbon-based friend?', 'Beep boop, go!'];
micBtn.onclick = () => { if (listening) rec.stop(); else startMic(MIC_LINES[Math.floor(Math.random() * MIC_LINES.length)]); };
function startMic(greeting){
  if (!SR || listening || busy) return;
  micBusy = true;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  unlockTTS();
  rec = new SR();
  rec.lang = navigator.language || 'en-US';
  rec.interimResults = true;
  rec.continuous = false;
  rec.onstart = () => {
    listening = true; lastActive = Date.now();
    micBtn.classList.add('on'); micBtn.setAttribute('aria-pressed', 'true');
    eyes.clearMood(0); eyes.set('listening'); status(greeting || 'Listening');
  };
  rec.onresult = e => {
    let text = '';
    for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
    qEl.value = text.trim(); autosize(); updateSend();
  };
  rec.onerror = e => {
    status(e.error === 'not-allowed' ? 'Microphone blocked. Allow it in your browser settings.'
         : e.error === 'no-speech' ? 'I heard nothing. Tap the mic and try again.'
         : 'Mic error: ' + e.error);
  };
  rec.onend = () => {
    listening = false;
    micBtn.classList.remove('on'); micBtn.setAttribute('aria-pressed', 'false');
    if (eyes.state === 'listening') eyes.set(pcReady ? 'idle' : 'sad');
    micBusy = false;
    if (qEl.value.trim()) submitVoice();
  };
  try { rec.start(); } catch (err) { micBusy = false; status('Mic error: ' + (err.message || err)); }
}
function submitVoice(){
  fromVoice = true;
  ask();
}

/* first touch unlocks speech on phones */
['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => {
  lastActive = Date.now();
  if (eyes.moodName === 'sleepy' && eyes.idleNap) eyes.clearMood(0);
  if (!window.__unlocked) { window.__unlocked = true; if (voiceOn) unlockTTS(); }
}));

/* ---------- Input ---------- */
function autosize(){ qEl.style.height = 'auto'; qEl.style.height = Math.min(qEl.scrollHeight, 140) + 'px'; }
qEl.addEventListener('input', () => { autosize(); updateSend(); });
qEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); }
});
sendBtn.onclick = ask;

/* ---------- Start ---------- */
renderBrain();
renderSpeaker();
eyes.set('sleep');
connectPC();
</script>
</body>
