<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1633">
<title>Blink — ask your files</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%230E1633'/><rect x='20' y='28' width='22' height='44' rx='8' fill='%237CF3E4'/><rect x='58' y='28' width='22' height='44' rx='8' fill='%237CF3E4'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9E6F3; --ink:#1E1B33; --muted:#5E5A78; --line:#CFCAE3;
  --screen:#0E1633; --rim:#1B2550; --glow:#7CF3E4; --pink:#FF5FA2;
  --bubble:#FFFFFF; --mine:#1E1B33; --mine-ink:#F4F2FB;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#17152A;--ink:#ECEAF6;--muted:#A19DBD;--line:#2F2B4A;--bubble:#221F3A;--mine:#ECEAF6;--mine-ink:#17152A}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
button,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;max-width:720px;margin:0 auto}

/* Face */
.face{position:relative;margin:max(10px,env(safe-area-inset-top)) 12px 0;height:min(38dvh,300px);min-height:190px;background:var(--screen);border-radius:36px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 6px var(--rim),inset 0 0 70px #000b;touch-action:manipulation}
.eyes{display:flex;gap:min(14vw,92px);margin-top:-18px;transform:translate(var(--lx,0px),var(--ly,0px));transition:transform .28s cubic-bezier(.3,.7,.3,1)}
.eye{width:min(20vw,96px);height:min(25vw,120px);background:var(--glow);border-radius:30%;box-shadow:0 0 18px #7CF3E4aa,0 0 56px #7CF3E450;transform:scale(var(--sx,1),calc(var(--sy,1) * var(--b,1)));transition:transform .14s ease,border-radius .3s ease}
.face.blink .eye{--b:.07}
.face.pop .eye{--sx:1.08}
.face[data-state=sleep] .eye{--sy:.08}
.face[data-state=loading] .eye{--sy:.4}
.face[data-state=reading] .eye{--sy:.72}
.face[data-state=thinking] .eye{--sy:.55;border-radius:22% 22% 45% 45%}
.face[data-state=thinking] .eye.r{--sy:.78}
.face[data-state=happy] .eye{--sy:.55;border-radius:50% 50% 14% 14% / 80% 80% 14% 14%}
.face[data-state=listening] .eye{--sy:1.08}
.face[data-state=sad] .eye{--sy:.6;border-radius:14% 14% 50% 50% / 14% 14% 80% 80%}
.status{position:absolute;left:18px;right:18px;bottom:16px;margin:0;color:#BFD9E8;font-size:14px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--pink);transition:width .2s}
.wake{position:absolute;bottom:44px;border:0;border-radius:999px;padding:10px 20px;background:var(--glow);color:var(--screen);font-weight:700;cursor:pointer}
.ear{position:absolute;top:14px;right:18px;margin:0;padding:3px 10px;border-radius:999px;background:#FF5FA233;color:#FFB3D2;font-size:13px}
.ear[hidden]{display:none}
.name{position:absolute;top:16px;left:22px;margin:0;font:600 15px/1 Unbounded,system-ui,sans-serif;color:#5C6BA8;letter-spacing:.02em}

/* Chat */
.log{overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.empty{margin:auto;max-width:34ch;text-align:center;color:var(--muted)}
.msg{max-width:86%;padding:10px 14px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere}
.me{margin-left:auto;background:var(--mine);color:var(--mine-ink);border-bottom-right-radius:6px}
.bot{background:var(--bubble);border:1px solid var(--line);border-bottom-left-radius:6px}
.src{display:block;margin-top:6px;font-size:13px;color:var(--muted)}

/* Dock */
.dock{padding:8px 12px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.files:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:3px 4px 3px 10px;border-radius:999px;background:var(--bubble);border:1px solid var(--line);font-size:13px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;width:24px;height:24px;border-radius:50%;cursor:pointer;color:var(--muted)}
.row{display:flex;align-items:flex-end;gap:8px}
.icon{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bubble);display:grid;place-items:center;cursor:pointer}
.icon svg{width:22px;height:22px}
textarea{flex:1;min-height:44px;max-height:140px;resize:none;padding:10px 14px;border-radius:22px;border:1px solid var(--line);background:var(--bubble);font-size:16px;line-height:1.4}
.send{background:var(--pink);border-color:var(--pink);color:#fff}
.send:disabled{opacity:.4;cursor:default}
.mic.on{background:var(--pink);border-color:var(--pink);color:#fff;animation:ping 1.2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 #FF5FA299}100%{box-shadow:0 0 0 14px #FF5FA200}}
details{margin-top:8px;font-size:14px;color:var(--muted)}
summary{cursor:pointer;padding:4px 0;width:max-content}
.opts{display:grid;gap:10px;padding:8px 0 4px}
.opts label{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--ink)}
.opts select{max-width:62%;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bubble)}
.opts input[type=checkbox]{width:20px;height:20px;accent-color:var(--pink)}
.opts input[type=url],.opts input[type=text]{width:62%;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bubble);font-size:16px}
.opts [hidden]{display:none}
.diag{margin:0;font-size:13px;white-space:pre-line;color:var(--muted)}
.link{border:0;background:none;padding:0;color:var(--pink);cursor:pointer;justify-self:start}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.eyes,.eye,.bar{transition:none}.mic.on{animation:none}}
</style>
</head>
<body>
<div class="app">
  <section class="face" id="face" data-state="sleep" aria-label="Blink">
    <p class="name">Blink</p>
    <p class="ear" id="ear" hidden>Say “Hey Blink”</p>
    <div class="eyes" id="eyes"><div class="eye l"></div><div class="eye r"></div></div>
    <button class="wake" id="wake">Wake Blink</button>
    <p class="status" id="status" role="status">Asleep. The first wake-up downloads the model once.</p>
    <div class="bar" id="bar"></div>
  </section>

  <main class="log" id="log">
    <p class="empty" id="empty">Add a PDF, Word or text file, then ask about it. Everything runs on this phone.</p>
  </main>

  <footer class="dock">
    <div class="files" id="files"></div>
    <div class="row">
      <label class="icon" title="Add files">
        <input id="picker" class="sr" type="file" multiple accept=".pdf,.docx,.txt,.md,.csv,.json,.html,.htm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.5l-8.4 8.4a5.5 5.5 0 01-7.8-7.8l8.9-8.9a3.7 3.7 0 015.2 5.2l-8.9 8.9a1.8 1.8 0 01-2.6-2.6L15.6 7.5"/></svg>
        <span class="sr">Add files</span>
      </label>
      <textarea id="q" rows="1" placeholder="Ask about your files" enterkeyhint="send"></textarea>
      <button class="icon mic" id="mic" aria-label="Speak your question" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
      </button>
      <button class="icon send" id="send" disabled aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <details>
      <summary>Settings</summary>
      <div class="opts">
        <label>Run on <select id="mode"><option value="phone">This phone</option><option value="pc">My PC (Ollama)</option></select></label>
        <label id="phoneModel">Model <select id="model"></select></label>
        <label id="pcUrlRow" hidden>PC link <input id="pcUrl" type="url" placeholder="https://….trycloudflare.com" autocomplete="off"></label>
        <label id="pcModelRow" hidden>PC model <input id="pcModel" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
        <button class="link" id="connect" hidden>Connect to PC</button>
        <label>Speak answers <input type="checkbox" id="speak"></label>
        <label>Wake word “Hey Blink” <input type="checkbox" id="wake-word"></label>
        <label>Funny personality <input type="checkbox" id="fun"></label>
        <button class="link" id="clear">Clear chat</button>
        <p class="diag" id="diag">Checking this phone…</p>
      </div>
    </details>
  </footer>
</div>

<script type="module">
const WEBLLM = "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.85/+esm";
let webllm = null;

const PDFJS = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";
const PDFJS_WORKER = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
const MAMMOTH = "https://cdn.jsdelivr.net/npm/mammoth@1.12.3/mammoth.browser.min.js";

const $ = s => document.querySelector(s);
const face = $('#face'), eyesEl = $('#eyes'), statusEl = $('#status'), bar = $('#bar');
const logEl = $('#log'), qEl = $('#q'), sendBtn = $('#send'), wakeBtn = $('#wake');
const modelSel = $('#model'), speakBox = $('#speak');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} }
};
const status = t => statusEl.textContent = t;

/* ---------- Eyes ---------- */
const eyes = {
  state: 'sleep', timer: 0, lastPointer: 0, lastPop: 0,
  set(s){
    this.state = s; face.dataset.state = s;
    clearInterval(this.timer); this.timer = 0;
    if (s === 'loading') this.sweep(28, 0, 700);
    else if (s === 'reading') this.sweep(24, 16, 450);
    else if (s === 'thinking') this.look(22, -18);
    else if (s === 'sad') this.look(0, 14);
    else if (s === 'talking') this.look(0, 6);
    else if (s === 'listening') this.look(0, -4);
    else this.look(0, 0);
  },
  look(x, y){ eyesEl.style.setProperty('--lx', x + 'px'); eyesEl.style.setProperty('--ly', y + 'px'); },
  sweep(x, y, ms){
    this.look(-x, y);
    if (calm) return;
    let d = 1;
    this.timer = setInterval(() => { d = -d; this.look(d * x, y); }, ms);
  },
  blink(){ face.classList.add('blink'); setTimeout(() => face.classList.remove('blink'), 130); },
  pop(){
    const now = performance.now();
    if (calm || now - this.lastPop < 110) return;
    this.lastPop = now;
    face.classList.add('pop'); setTimeout(() => face.classList.remove('pop'), 90);
  },
  flash(s, ms){ this.set(s); setTimeout(() => { if (this.state === s) this.set('idle'); }, ms); }
};

(function blinkLoop(){
  if (!calm && !['sleep','happy','sad'].includes(eyes.state)) eyes.blink();
  setTimeout(blinkLoop, 2500 + Math.random() * 3500);
})();
(function glanceLoop(){
  if (!calm && eyes.state === 'idle' && performance.now() - eyes.lastPointer > 2500)
    eyes.look(Math.round((Math.random() - .5) * 50), Math.round((Math.random() - .5) * 26));
  setTimeout(glanceLoop, 1800 + Math.random() * 2200);
})();
addEventListener('pointermove', e => {
  if (eyes.state !== 'idle') return;
  const r = face.getBoundingClientRect();
  const dx = (e.clientX - (r.left + r.width / 2)) / (innerWidth / 2);
  const dy = (e.clientY - (r.top + r.height / 2)) / (innerHeight / 2);
  eyes.lastPointer = performance.now();
  eyes.look(Math.round(Math.max(-1, Math.min(1, dx)) * 30), Math.round(Math.max(-1, Math.min(1, dy)) * 18));
});
face.addEventListener('click', e => { if (e.target === wakeBtn) return; if (eyes.state === 'idle') eyes.flash('happy', 700); });

/* ---------- Models ---------- */
const CHOICES = [
  ['Qwen3-0.6B', 'Qwen3 0.6B (lightest)'],
  ['Llama-3.2-1B-Instruct', 'Llama 3.2 1B'],
  ['Qwen2.5-1.5B-Instruct', 'Qwen2.5 1.5B'],
  ['Qwen3-1.7B', 'Qwen3 1.7B (best answers)']
];
let engine = null, loadedId = null, busy = false, loading = false, loadErr = '';
let mode = store.get('blink-mode') === 'pc' ? 'pc' : 'phone';
let pcUrl = store.get('blink-pc-url') || '', pcModel = store.get('blink-pc-model') || 'qwen3:14b', pcReady = false;
const ready = () => mode === 'pc' ? pcReady : !!engine;
addEventListener('unhandledrejection', e => { if (loading) loadErr = 'Error: ' + (e.reason?.message || e.reason); });
addEventListener('error', e => { if (loading) loadErr = 'Error: ' + e.message; });
const cacheBackend = store.get('blink-cache') === 'indexeddb' ? 'indexeddb' : 'cache';

async function setupModels(){
  if (mode === 'pc' && pcUrl) wake();
  try { webllm = await import(WEBLLM); }
  catch {
    if (mode === 'pc') return;
    eyes.set('sad'); wakeBtn.hidden = true;
    status('AI engine did not load. Open this page from an https:// link with internet on.');
    return;
  }
  let f16 = false, a = null;
  if (navigator.gpu) {
    try { a = await navigator.gpu.requestAdapter(); f16 = !!a?.features.has('shader-f16'); } catch {}
  }
  const d = [];
  const mb = n => Math.round(n / 1048576) + ' MB';
  if (!navigator.gpu) d.push('GPU: no WebGPU');
  else if (!a) d.push('GPU: WebGPU on, but no GPU adapter');
  else {
    d.push('GPU: ' + ([a.info?.vendor, a.info?.architecture, a.info?.description].filter(Boolean).join(' ') || 'unknown'));
    d.push('f16: ' + (f16 ? 'yes' : 'no'));
    d.push('Max buffer: ' + mb(a.limits.maxBufferSize) + ' · max storage binding: ' + mb(a.limits.maxStorageBufferBindingSize));
  }
  try { const e = await navigator.storage.estimate(); d.push('Storage free: ' + mb(e.quota - e.usage)); } catch {}
  d.push('RAM: ' + (navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'unknown') + ' · cache: ' + cacheBackend);
  d.push(navigator.userAgent);
  $('#diag').textContent = d.join('\n');
  const quant = f16 ? 'q4f16_1' : 'q4f32_1';
  const list = webllm.prebuiltAppConfig.model_list;
  for (const [base, label] of CHOICES) {
    const id = `${base}-${quant}-MLC`;
    const rec = list.find(m => m.model_id === id);
    if (!rec) continue;
    const o = new Option(rec.vram_required_MB ? `${label} · ~${Math.round(rec.vram_required_MB)} MB` : label, id);
    modelSel.add(o);
  }
  const saved = store.get('blink-model');
  if (mode === 'phone' && saved && [...modelSel.options].some(o => o.value === saved)) {
    modelSel.value = saved;
    wake();
  }
}

async function connectPC(){
  if (!pcUrl) { status('Enter your PC link in Settings, then tap Connect to PC.'); document.querySelector('details').open = true; return; }
  busy = true; updateSend();
  wakeBtn.hidden = true;
  eyes.set('loading'); status('Connecting to your PC');
  try {
    const r = await fetch(pcUrl + '/api/tags', { signal: AbortSignal.timeout(10000) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const names = ((await r.json()).models || []).map(m => m.name);
    const want = pcModel.includes(':') ? pcModel : pcModel + ':latest';
    if (!names.includes(want)) {
      eyes.set('sad'); wakeBtn.hidden = false;
      status(`${pcModel} is not on the PC. Run: ollama pull ${pcModel}`);
    } else {
      pcReady = true;
      status(`Connected to your PC · ${pcModel}`);
      eyes.flash('happy', 1200);
    }
  } catch (e) {
    eyes.set('sad'); wakeBtn.hidden = false;
    const why = /HTTP 403/.test(e.message) ? 'blocked by OLLAMA_ORIGINS'
              : /HTTP 5\d\d/.test(e.message) ? 'tunnel cannot reach Ollama'
              : e.name === 'TimeoutError' ? 'timed out'
              : 'no response (' + e.message + ')';
    status('Cannot reach your PC: ' + why + '.');
  }
  busy = false; updateSend();
  resumeWake();
}

async function* pcStream(messages){
  const body = { model: pcModel, messages, stream: true, think: false,
    options: { temperature: 0.7, top_p: 0.8, presence_penalty: 0.5, num_predict: 512 } };
  const post = () => fetch(pcUrl + '/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  let res = await post();
  if (!res.ok) {
    const t = await res.text();
    if (!/think/i.test(t)) throw new Error(t || 'HTTP ' + res.status);
    delete body.think;
    res = await post();
    if (!res.ok) throw new Error((await res.text()) || 'HTTP ' + res.status);
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i).trim();
      buf = buf.slice(i + 1);
      if (!line) continue;
      const j = JSON.parse(line);
      if (j.error) throw new Error(j.error);
      if (j.message?.content) yield j.message.content;
    }
  }
}

async function* chatStream(messages){
  if (mode === 'pc') { yield* pcStream(messages); return; }
  const stream = await engine.chat.completions.create({
    messages, stream: true, temperature: 0.7, top_p: 0.8, presence_penalty: 0.5, max_tokens: 512,
    extra_body: { enable_thinking: false }
  });
  for await (const ch of stream) {
    const d = ch.choices[0]?.delta?.content || '';
    if (d) yield d;
  }
}

async function wake(){
  if (busy) return;
  if (mode === 'pc') return connectPC();
  if (!webllm) return;
  if (!navigator.gpu) {
    eyes.set('sad');
    status('No WebGPU here. Use recent Chrome on Android or Safari on iOS 26+, over HTTPS.');
    return;
  }
  busy = true; loading = true; updateSend();
  wakeBtn.hidden = true;
  eyes.set('loading');
  const id = modelSel.value;
  const t0 = Date.now();
  let last = t0, label = 'Downloading model 0%';
  loadErr = '';
  const tick = setInterval(() => {
    status(`${label} · ${Math.round((Date.now() - t0) / 1000)}s · keep this screen open`);
    if (loadErr || Date.now() - last > 180000) {
      clearInterval(tick);
      eyes.set('sad');
      status(loadErr || 'Download looks stuck. Tap Try again.');
      wakeBtn.textContent = 'Try again';
      wakeBtn.onclick = () => { store.set('blink-cache', cacheBackend === 'cache' ? 'indexeddb' : 'cache'); location.reload(); };
      wakeBtn.hidden = false;
    }
  }, 1000);
  try {
    const onProg = r => {
      last = Date.now();
      label = r.progress < 1 ? `Downloading model ${Math.round(r.progress * 100)}%` : 'Preparing on GPU';
      bar.style.width = (r.progress * 100).toFixed(1) + '%';
    };
    if (!engine) engine = await webllm.CreateMLCEngine(id, {
      appConfig: { ...webllm.prebuiltAppConfig, cacheBackend },
      initProgressCallback: onProg
    });
    else await engine.reload(id);
    clearInterval(tick);
    wakeBtn.hidden = true; wakeBtn.textContent = 'Wake Blink'; wakeBtn.onclick = wake;
    loadedId = id;
    store.set('blink-model', id);
    bar.style.width = '0';
    status('Awake. Ask me anything.');
    eyes.flash('happy', 1200);
  } catch (e) {
    clearInterval(tick);
    bar.style.width = '0';
    eyes.set('sad');
    status('Model failed to load: ' + (e.message || e));
    wakeBtn.hidden = false;
  }
  busy = false; loading = false; updateSend();
  resumeWake();
}
wakeBtn.onclick = wake;
modelSel.onchange = () => { if (engine) wake(); };

/* ---------- Documents & retrieval ---------- */
const seg = Intl.Segmenter ? new Intl.Segmenter(undefined, { granularity: 'word' }) : null;
const STOP = new Set('a an and are as at be by for from has have how i in is it its of on or that the this to was were what when where which who why will with you your do does did can about into than then there these those not no'.split(' '));
function toks(s){
  s = s.toLowerCase();
  const w = seg ? [...seg.segment(s)].filter(x => x.isWordLike).map(x => x.segment)
                : s.split(/[^\p{L}\p{N}]+/u);
  return w.filter(t => t && !STOP.has(t) && (t.length > 1 || /\d/.test(t)));
}
function mk(text, src){
  const tk = toks(text), tf = new Map();
  for (const t of tk) tf.set(t, (tf.get(t) || 0) + 1);
  return { text, src, tf, len: tk.length || 1 };
}
function chunk(text, src, size = 700, overlap = 120){
  text = text.replace(/\r/g, '').replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
  const out = [];
  let i = 0;
  while (i < text.length) {
    let end = Math.min(i + size, text.length);
    if (end < text.length) {
      const cut = Math.max(text.lastIndexOf('\n', end), text.lastIndexOf('. ', end));
      if (cut > i + size * .5) end = cut + 1;
    }
    const t = text.slice(i, end).trim();
    if (t) out.push(mk(t, src));
    if (end >= text.length) break;
    i = Math.max(end - overlap, i + 1);
  }
  return out;
}

let docs = [], chunks = [], df = new Map(), avgdl = 1;
function rebuild(){
  chunks = docs.flatMap(d => d.chunks);
  df = new Map();
  let tot = 0;
  for (const c of chunks) { tot += c.len; for (const t of c.tf.keys()) df.set(t, (df.get(t) || 0) + 1); }
  avgdl = tot / (chunks.length || 1);
}
function retrieve(q, k = 4){
  const total = chunks.reduce((n, c) => n + c.text.length, 0);
  if (total <= 5000) return chunks;
  const qt = [...new Set(toks(q))], N = chunks.length;
  const hits = chunks.map(c => {
    let s = 0;
    for (const t of qt) {
      const f = c.tf.get(t); if (!f) continue;
      const n = df.get(t);
      const idf = Math.log(1 + (N - n + .5) / (n + .5));
      s += idf * f * 2.2 / (f + 1.2 * (.25 + .75 * c.len / avgdl));
    }
    return [s, c];
  }).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).slice(0, k).map(x => x[1]);
  return hits.length ? hits : chunks.slice(0, 3);
}

const libs = {};
function lib(url){
  return libs[url] ||= new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = url; s.onload = res;
    s.onerror = () => { delete libs[url]; rej(new Error('Could not load a file reader. Check the connection.')); };
    document.head.appendChild(s);
  });
}
async function readFile(f){
  const ext = f.name.split('.').pop().toLowerCase();
  if (ext === 'pdf') {
    await lib(PDFJS);
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
    const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
    const out = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      status(`Reading ${f.name}: page ${p} of ${pdf.numPages}`);
      const tc = await (await pdf.getPage(p)).getTextContent();
      out.push(...chunk(tc.items.map(it => it.str + (it.hasEOL ? '\n' : ' ')).join(''), `${f.name} p.${p}`));
    }
    return out;
  }
  if (ext === 'docx') {
    await lib(MAMMOTH);
    const r = await mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() });
    return chunk(r.value, f.name);
  }
  let txt = await f.text();
  if (ext === 'html' || ext === 'htm') txt = new DOMParser().parseFromString(txt, 'text/html').body.textContent || '';
  return chunk(txt, f.name);
}

$('#picker').onchange = async e => {
  const files = [...e.target.files];
  e.target.value = '';
  if (!files.length) return;
  const prev = eyes.state;
  eyes.set('reading');
  let ok = 0;
  for (const f of files) {
    status(`Reading ${f.name}`);
    try {
      const c = await readFile(f);
      if (!c.length) { status(`No text found in ${f.name}. Scanned PDFs need OCR first.`); continue; }
      docs = docs.filter(d => d.name !== f.name);
      docs.push({ name: f.name, chunks: c });
      ok++;
    } catch (err) {
      status(`Could not read ${f.name}: ${err.message || err}`);
    }
  }
  rebuild(); renderFiles();
  if (ok) { status(`Read ${ok} file${ok > 1 ? 's' : ''}. Ask away.`); eyes.flash('happy', 1000); }
  else eyes.flash('sad', 1500);
  if (prev === 'sleep' && !ready()) setTimeout(() => { if (!ready() && eyes.state === 'idle') eyes.set('sleep'); }, 1100);
};

function renderFiles(){
  const box = $('#files');
  box.replaceChildren(...docs.map(d => {
    const el = document.createElement('div');
    el.className = 'chip';
    el.innerHTML = '<span></span><button aria-label="Remove file">✕</button>';
    el.firstChild.textContent = d.name;
    el.lastChild.onclick = () => { docs = docs.filter(x => x !== d); rebuild(); renderFiles(); };
    return el;
  }));
  qEl.placeholder = docs.length ? 'Ask about your files' : 'Ask me anything';
}

/* ---------- Chat ---------- */
const FUN = 'Personality: you are Blink, a tiny, overly dramatic robot with two big glowing eyes who lives in a maker lab. You adore 3D printers, are secretly scared of the laser cutter, think you are a genius, and refer to humans as "my favorite carbon-based friends". Add one short quirky, funny remark to each answer, then give the real answer. Jokes must never replace or change the facts. Your replies are read aloud, so use plain sentences with no emojis, lists or markdown. ';
const PLAIN = 'You are Blink, a friendly assistant on a phone. Your replies may be read aloud, so avoid emojis and markdown. ';
const SYS_DOCS_TASK = 'If the file excerpts the user provides answer the question, answer from them and mention the source name in square brackets. If they do not, ignore the excerpts and answer from your general knowledge, starting with "(general knowledge)". Be short and clear. Always give a real answer.';
const SYS_CHAT_TASK = 'Answer every question directly in 1 to 3 sentences using your general knowledge. Always give a real answer.';
const funBox = $('#fun');
const sysPrompt = docs => (funBox.checked ? FUN : PLAIN) + (docs ? SYS_DOCS_TASK : SYS_CHAT_TASK);
let history = [];
const NOPE = /not sure|don't know|do not know|can't help|cannot help/i;

function addMsg(who, text){
  $('#empty')?.remove();
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  el.textContent = text;
  logEl.appendChild(el);
  logEl.scrollTop = logEl.scrollHeight;
  return el;
}
const clean = s => s.replace(/<think>[\s\S]*?(<\/think>|$)/g, '').replace(/\*\*/g, '').trim();

function updateSend(){ sendBtn.disabled = !qEl.value.trim() || (busy && !loading); }

async function ask(){
  const spoken = fromVoice; fromVoice = false;
  const q = qEl.value.trim();
  if (q && loading) { status('Still downloading the model. Send again when the eyes wake up.'); eyes.blink(); return; }
  if (!q || busy) return;
  if (!ready()) { status(mode === 'pc' ? 'Connect to your PC first.' : 'Wake Blink first.'); eyes.blink(); wakeBtn.focus(); return; }
  busy = true; qEl.value = ''; autosize(); updateSend();
  speechSynthesis?.cancel();
  addMsg('me', q);

  let ctx = '', srcs = [];
  if (chunks.length) {
    eyes.set('reading'); status('Looking through your files');
    await sleep(400);
    const hits = retrieve(q);
    ctx = hits.map(c => `[${c.src}]\n${c.text}`).join('\n\n---\n\n');
    srcs = [...new Set(hits.map(h => h.src))];
  }
  eyes.set('thinking'); status('Thinking');

  const messages = [
    { role: 'system', content: sysPrompt(chunks.length > 0) },
    ...history.filter(m => !(m.role === 'assistant' && NOPE.test(m.content))).slice(-4),
    { role: 'user', content: ctx ? `Excerpts from my files:\n\n${ctx}\n\nQuestion: ${q}` : q }
  ];
  history.push({ role: 'user', content: q });

  const bubble = addMsg('bot', '');
  let out = '';
  try {
    let first = true;
    for await (const d of chatStream(messages)) {
      if (first) { eyes.set('talking'); status('Answering'); first = false; }
      out += d;
      bubble.textContent = clean(out);
      eyes.pop();
      logEl.scrollTop = logEl.scrollHeight;
    }
  } catch (e) {
    bubble.textContent = 'Something went wrong: ' + (e.message || e);
    eyes.flash('sad', 2000); status(mode === 'pc' ? 'Check that the PC and tunnel are still running.' : 'Try again, or pick a lighter model in Settings.');
    history.pop(); busy = false; updateSend();
    resumeWake();
    return;
  }

  out = clean(out) || '(no answer)';
  bubble.textContent = out;
  history.push({ role: 'assistant', content: out });
  if (srcs.length) {
    const s = document.createElement('span');
    s.className = 'src';
    s.textContent = 'From: ' + srcs.join(', ');
    bubble.appendChild(s);
  }
  logEl.scrollTop = logEl.scrollHeight;
  status('Awake. Ask me anything.');
  busy = false; updateSend();

  if ((spoken || speakBox.checked) && 'speechSynthesis' in window) say(out);
  else eyes.flash('happy', 900);
}

let speaking = false;
function say(text){
  stopWake();
  speaking = true;
  const u = new SpeechSynthesisUtterance(text.replace(/\[[^\]]*\]/g, ''));
  if (/[\u0E00-\u0E7F]/.test(text)) u.lang = 'th-TH';
  u.rate = 1.05;
  u.pitch = funBox.checked ? 1.35 : 1;
  u.onstart = () => eyes.set('talking');
  u.onboundary = () => eyes.pop();
  u.onend = u.onerror = () => {
    speaking = false;
    if (eyes.state === 'talking') eyes.flash('happy', 800);
    resumeWake();
  };
  speechSynthesis.speak(u);
}

/* ---------- Microphone ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = $('#mic');
let rec = null, listening = false, fromVoice = false;
const unlockTTS = () => { if ('speechSynthesis' in window) speechSynthesis.speak(new SpeechSynthesisUtterance('')); };
if (!SR) micBtn.hidden = true;
micBtn.onclick = () => {
  if (listening) { rec.stop(); return; }
  if (busy) return;
  micBusy = true; stopWake(); chirpInit();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  unlockTTS();
  rec = new SR();
  rec.lang = navigator.language || 'en-US';
  rec.interimResults = true;
  rec.continuous = false;
  rec.onstart = () => {
    listening = true;
    micBtn.classList.add('on'); micBtn.setAttribute('aria-pressed', 'true');
    eyes.set('listening'); status('Listening');
  };
  rec.onresult = e => {
    let text = '';
    for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
    qEl.value = text.trim(); autosize(); updateSend();
  };
  rec.onerror = e => {
    status(e.error === 'not-allowed' ? 'Microphone blocked. Allow it in your browser settings.'
         : e.error === 'no-speech' ? 'Heard nothing. Tap the mic and try again.'
         : 'Mic error: ' + e.error);
  };
  rec.onend = () => {
    listening = false;
    micBtn.classList.remove('on'); micBtn.setAttribute('aria-pressed', 'false');
    if (eyes.state === 'listening') eyes.set(ready() ? 'idle' : 'sleep');
    micBusy = false;
    if (qEl.value.trim()) submitVoice();
    else resumeWake();
  };
  try { rec.start(); } catch (err) { micBusy = false; status('Mic error: ' + (err.message || err)); resumeWake(); }
};

/* ---------- Wake word ---------- */
const WAKE = /(?:hey|hi|hay|okay|ok|yo)[\s,.!]*(?:blink|blinks|blank|bling|plink|link|blinky)\b|เฮ้\s*(?:บลิ้ง|บลิงค์|บลิ๊ง|บลิงก์)/i;
const WAKE_LINES = ['Ears on!', 'You rang?', 'Blink is listening. Dramatically.', 'Yes, my favorite carbon-based friend?', 'Beep boop, go!'];
const wakeBox = $('#wake-word'), earEl = $('#ear');
let wakeRec = null, micBusy = false, wakeFails = 0, audioCtx = null;

function chirpInit(){ try { audioCtx ||= new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {} }
function chirp(){
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [880, 1320].forEach((f, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = f; o.type = 'sine';
    g.gain.setValueAtTime(0.0001, t + i * 0.09);
    g.gain.exponentialRampToValueAtTime(0.25, t + i * 0.09 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + 0.08);
    o.connect(g).connect(audioCtx.destination);
    o.start(t + i * 0.09); o.stop(t + i * 0.09 + 0.1);
  });
}
const wakeAllowed = () => SR && wakeBox.checked && !busy && !micBusy && !listening && !speaking && document.visibilityState === 'visible';

function stopWake(){
  if (!wakeRec) return;
  const r = wakeRec; wakeRec = null;
  r.onend = r.onresult = r.onerror = null;
  try { r.abort(); } catch {}
  earEl.hidden = true;
}
function resumeWake(){ setTimeout(startWake, 500); }

function submitVoice(){
  fromVoice = true;
  ask().finally(() => { if (!speaking) resumeWake(); });
}

function startWake(){
  if (wakeRec || !wakeAllowed()) return;
  const r = new SR();
  wakeRec = r;
  r.lang = navigator.language || 'en-US';
  r.continuous = true;
  r.interimResults = true;
  let armed = false, armTimer = 0;
  const disarm = () => {
    armed = false; clearTimeout(armTimer);
    if (eyes.state === 'listening') eyes.set(ready() ? 'idle' : 'sleep');
    qEl.value = ''; autosize(); updateSend();
    status(ready() ? 'Awake. Ask me anything.' : 'Say “Hey Blink” after waking me up.');
  };
  r.onstart = () => { earEl.hidden = false; wakeFails = 0; };
  r.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      let t = res[0].transcript;
      const m = t.match(WAKE);
      if (busy || speaking) return;
      if (!armed) {
        if (!m) continue;
        armed = true;
        chirp(); eyes.set('listening'); eyes.pop();
        status(WAKE_LINES[Math.floor(Math.random() * WAKE_LINES.length)]);
      }
      if (m) t = t.slice(m.index + m[0].length);
      t = t.replace(/^[\s,.!?]+/, '').trim();
      clearTimeout(armTimer);
      armTimer = setTimeout(disarm, 8000);
      if (t) { qEl.value = t; autosize(); updateSend(); }
      if (res.isFinal && t) {
        clearTimeout(armTimer);
        stopWake();
        if (eyes.state === 'listening') eyes.set('idle');
        submitVoice();
        return;
      }
    }
  };
  r.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      wakeBox.checked = false; store.set('blink-wake', '0');
      status('Microphone blocked. Allow it in your browser settings to use “Hey Blink”.');
    } else if (e.error !== 'no-speech' && e.error !== 'aborted') wakeFails++;
  };
  r.onend = () => {
    wakeRec = null; earEl.hidden = true;
    clearTimeout(armTimer);
    if (armed && eyes.state === 'listening') eyes.set(ready() ? 'idle' : 'sleep');
    if (wakeFails > 5) { status('“Hey Blink” keeps stopping. Tap the mic instead.'); return; }
    setTimeout(startWake, 300 + wakeFails * 1000);
  };
  try { r.start(); } catch { wakeRec = null; }
}

wakeBox.checked = store.get('blink-wake') === '1';
if (!SR) wakeBox.closest('label').hidden = true;
wakeBox.onchange = () => {
  store.set('blink-wake', wakeBox.checked ? '1' : '0');
  if (wakeBox.checked) { chirpInit(); unlockTTS(); wakeFails = 0; startWake(); }
  else stopWake();
};
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') resumeWake(); else stopWake(); });
funBox.checked = store.get('blink-fun') !== '0';
funBox.onchange = () => store.set('blink-fun', funBox.checked ? '1' : '0');

function autosize(){ qEl.style.height = 'auto'; qEl.style.height = Math.min(qEl.scrollHeight, 140) + 'px'; }
qEl.addEventListener('input', () => { autosize(); updateSend(); });
qEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); }
});
sendBtn.onclick = ask;
speakBox.checked = store.get('blink-speak') === '1';
speakBox.onchange = () => { store.set('blink-speak', speakBox.checked ? '1' : '0'); if (speakBox.checked) unlockTTS(); };
$('#clear').onclick = () => {
  history = []; speechSynthesis?.cancel();
  logEl.innerHTML = '<p class="empty" id="empty">Chat cleared. Your files are still loaded.</p>';
};

const modeSel = $('#mode'), pcUrlEl = $('#pcUrl'), pcModelEl = $('#pcModel');
function showMode(){
  const pc = mode === 'pc';
  $('#phoneModel').hidden = pc;
  $('#pcUrlRow').hidden = $('#pcModelRow').hidden = $('#connect').hidden = !pc;
}
modeSel.value = mode; pcUrlEl.value = pcUrl; pcModelEl.value = pcModel; showMode();
if (mode === 'pc' && !pcUrl) status('Enter your PC link and model in Settings, then tap Connect to PC.');
modeSel.onchange = () => {
  mode = modeSel.value; store.set('blink-mode', mode); showMode();
  pcReady = false;
  if (ready()) { eyes.set('idle'); wakeBtn.hidden = true; status('Awake. Ask me anything.'); }
  else {
    eyes.set('sleep'); wakeBtn.hidden = false;
    status(mode === 'pc' ? 'Enter your PC link and model, then tap Connect to PC.' : 'Asleep. The first wake-up downloads the model once.');
  }
};
$('#connect').onclick = () => {
  pcUrl = pcUrlEl.value.trim().replace(/\/+$/, '');
  pcModel = pcModelEl.value.trim() || 'qwen3:14b';
  store.set('blink-pc-url', pcUrl); store.set('blink-pc-model', pcModel);
  pcReady = false;
  connectPC();
};

eyes.set('sleep');
setupModels();
resumeWake();
</script>
</body>
</html>
