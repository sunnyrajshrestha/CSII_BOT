<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1633">
<title>Kagome</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%230E1633'/><rect x='20' y='22' width='22' height='40' rx='8' fill='%237CF3E4'/><rect x='58' y='22' width='22' height='40' rx='8' fill='%237CF3E4'/><path d='M36 74q14 10 28 0' stroke='%237CF3E4' stroke-width='6' fill='none' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9E6F3; --ink:#1E1B33; --muted:#5E5A78; --line:#CFCAE3;
  --screen:#0E1633; --rim:#1B2550; --glow:#7CF3E4; --pink:#FF5FA2; --red:#FF3B5C;
  --bubble:#FFFFFF; --mine:#1E1B33; --mine-ink:#F4F2FB;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#17152A;--ink:#ECEAF6;--muted:#A19DBD;--line:#2F2B4A;--bubble:#221F3A;--mine:#ECEAF6;--mine-ink:#17152A}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
[hidden]{display:none!important}
.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;max-width:720px;margin:0 auto}

/* ---------- Face (anime rig) ---------- */
.face{--ink:#2A2440;position:relative;margin:max(10px,env(safe-area-inset-top)) 12px 0;height:min(40dvh,320px);min-height:220px;background:radial-gradient(#2A244012 1px,transparent 1.6px) 0 0/10px 10px,radial-gradient(ellipse at 50% 42%,#FFFAF5 0%,#FFEFE6 62%,#F7DCE3 100%);border-radius:36px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 3px var(--ink),0 6px 24px #2A244022;touch-action:manipulation;transition:box-shadow .3s,background .3s}
.face.red{background:radial-gradient(#2A244012 1px,transparent 1.6px) 0 0/10px 10px,radial-gradient(ellipse at 50% 42%,#FFF4F4 0%,#FFE1E1 62%,#F9C7CF 100%);box-shadow:inset 0 0 0 3px #C21E3A,0 6px 24px #C21E3A33}
.bob{width:100%;height:100%;display:grid;place-items:center;animation:breathe 4s ease-in-out infinite}
.head{width:min(100%,560px);transform:translate(calc(var(--lx,0px) * .25),calc(var(--ly,0px) * .25));transition:transform .35s cubic-bezier(.3,.7,.3,1)}
#rig{display:block;width:100%;height:auto;max-height:calc(min(40dvh,320px) - 34px);overflow:visible}
#rig .ink{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
#rig .lash{stroke-width:6.5;stroke:#1E1418}
#rig .spikes{stroke-width:3.4;stroke:#1E1418}
#rig .ticks{stroke-width:2;stroke:#1E1418;opacity:.7}
#rig .lower{stroke-width:2.4;opacity:.55}
#rig .brow{stroke-width:4;stroke:#6B4A3A}
#rig .sclera{fill:#fff}
#rig .pupil{fill:#101830}
#rig .heart{fill:#B0124F}
#rig .iris{stroke:#1C4424;stroke-width:2}
#rig .starP{fill:#F4FFB0;stroke:#2E5A1E;stroke-width:1.5}
#rig .nose{fill:none;stroke:#C98A7A;stroke-width:2.6;stroke-linecap:round}
#rig .spiral{fill:none;stroke:#6B3A1E;stroke-width:4.5;stroke-linecap:round;transform-box:fill-box;transform-origin:center;animation:spin 1.4s linear infinite}
#rig .blank{fill:#fff;stroke:#1E1418;stroke-width:3.5}
#rig .grim{fill:#fff;stroke:#6E2A2F;stroke-width:3;stroke-linejoin:round}
#rig #band{opacity:0;transition:opacity .3s}
.face.mood-love #rig #band,.face.mood-lovesick #rig #band,.face.mood-embarrassed #rig #band,.face.mood-shy #rig #band{opacity:.55}
#rig .hl{fill:#fff}
#rig .glyph{font:700 92px/1 Unbounded,system-ui,sans-serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
#rig .mouthInk{fill:none;stroke:#6E2A2F;stroke-width:3.8;stroke-linecap:round;stroke-linejoin:round}
#rig .mouthFill{fill:#E85C75;stroke:#6E2A2F;stroke-width:3;stroke-linejoin:round}
#rig .tongue{fill:#FFB0C0}
#rig .teeth{fill:#fff;stroke:#6E2A2F;stroke-width:2;stroke-linejoin:round}
#rig .stream{fill:none;stroke:#7CCBFF;stroke-width:9;stroke-linecap:round;stroke-dasharray:14 10;opacity:0;animation:stream .5s linear infinite}
.face.mood-sad #rig .stream,.face.mood-emotional #rig .stream,.face.mood-woeful #rig .stream{opacity:.9}
#rig .pool{fill:#BFE8FF;opacity:0}
.face.mood-sad #rig .pool,.face.mood-tearful #rig .pool,.face.mood-emotional #rig .pool,.face.mood-woeful #rig .pool{opacity:.85}
#rig .nb{fill:#DDF3FF99;stroke:#8CCBEA;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.face[data-state=sleep] #rig .nb,.face.mood-sleepy #rig .nb,.face.mood-asleep #rig .nb{opacity:1;animation:nbub 2.6s ease-in-out infinite}
#rig .spark{fill:#fff;opacity:0}
.face.mood-shine #rig .spark{opacity:1}
#rig g,#rig text{transform-box:fill-box;transform-origin:center}
.face.mood-stressed #rig .glyph{animation:spin 1s linear infinite}
.face.mood-laughing #rig .glyph{animation:squish .35s ease-in-out infinite}
.face.mood-love #rig .heart{animation:beat .9s ease-in-out infinite}
.face.mood-angry #rig #eyesG,.face.mood-scared #rig #eyesG,.face.mood-frightened #rig #eyesG,.face.mood-jumpy #rig #eyesG{animation:shakeS .16s linear infinite}
.face.mood-nervous #rig #eyesG,.face.mood-uncomfortable #rig #eyesG{animation:shakeS .45s linear infinite}
.face.mood-celebrating .head,.face.mood-energetic .head,.face.mood-perky .head{animation:hop .45s ease-in-out infinite}
.face.mood-stressed #rig #mouthG{animation:wobble .8s ease-in-out infinite}
.face.mood-laughing .head{animation:hop .35s ease-in-out infinite}
.face.impact .head{animation:punch .38s cubic-bezier(.3,1.6,.5,1)}

/* effects layer */
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.fx > *{position:absolute;opacity:0;transition:opacity .2s}
.speed{inset:-60%;background:repeating-conic-gradient(from 0deg,#2A244030 0deg 1.1deg,transparent 1.1deg 6deg);-webkit-mask:radial-gradient(circle,transparent 28%,#000 55%);mask:radial-gradient(circle,transparent 28%,#000 55%)}
.face.mood-scared .speed,.face.mood-frightened .speed,.face.impact .speed{opacity:1;animation:flicker .12s steps(2) infinite}
.gloom{left:12%;right:12%;top:0;height:55%;background:repeating-linear-gradient(90deg,#5A4E8A55 0 2px,transparent 2px 15px);-webkit-mask:linear-gradient(#000,transparent);mask:linear-gradient(#000,transparent)}
.face.mood-sad .gloom,.face.mood-woeful .gloom,.face.mood-disappointed .gloom{opacity:1}
.shock{left:0;right:0;top:-10%;height:66%;background:radial-gradient(ellipse 60% 64% at 50% 0%,#7FA8FFee,#7FA8FF00 100%)}
.shadeP{left:0;right:0;top:-10%;height:62%;background:radial-gradient(ellipse 55% 60% at 50% 0%,#FF8A9Acc,#FF8A9A00 100%)}
.face.mood-angry .shadeP,.face.mood-teased .shadeP,.face.mood-irritable .shadeP,.face.mood-grumpy .shadeP{opacity:1}
.face.mood-scared .shock,.face.mood-frightened .shock,.face.mood-jumpy .shock{opacity:1}
.vein{top:10%;right:14%;font-size:min(11vw,52px);line-height:1}
.face.red .vein,.face.mood-irritable .vein,.face.mood-grumpy .vein{opacity:1;animation:throb .5s ease-in-out infinite}
.sweat{top:20%;right:16%;width:min(5vw,24px);height:min(5vw,24px);background:linear-gradient(135deg,#FFFFFF,#7CCBFF);border:2px solid #4B8FC4;border-radius:0 50% 50% 50%;rotate:45deg}
.face.mood-worried .sweat,.face.mood-stressed .sweat,.face.mood-confused .sweat,.face.mood-frightened .sweat,.face.mood-apprehensive .sweat,.face.mood-jumpy .sweat,.face.mood-embarrassed .sweat,.face.mood-troubled .sweat,.face.mood-nervous .sweat,.face.mood-uncomfortable .sweat{opacity:1;animation:slide 1.8s ease-in infinite}
.face.mood-confused .sweat{right:auto;left:16%}
.zzz{top:12%;right:15%;font:700 min(6vw,28px)/1 Unbounded,system-ui,sans-serif;color:#5E5A78;white-space:pre}
.face.mood-sleepy .zzz,.face.mood-asleep .zzz,.face[data-state=sleep] .zzz{opacity:1;animation:floatz 2.6s ease-in-out infinite}
.qmark{top:8%;right:17%;font:700 min(10vw,48px)/1 Unbounded,system-ui,sans-serif;color:var(--ink)}
.face.mood-confused .qmark,.face.mood-bewildered .qmark,.face.mood-doubtful .qmark{opacity:1;animation:bob 1s ease-in-out infinite}
.bang{top:6%;right:15%;font:700 min(12vw,58px)/1 Unbounded,system-ui,sans-serif;color:#FF3B5C;-webkit-text-stroke:2px var(--ink)}
.face.notice .bang{opacity:1;animation:bang .7s cubic-bezier(.34,1.56,.64,1) both}
.dots{top:10%;right:14%;display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--ink);animation:dot 1.1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
.face[data-state=thinking]:not(.mood) .dots{opacity:1}
.hearts{inset:0}
.hearts i,.sparks i{position:absolute;font-style:normal;line-height:1}
.hearts i{bottom:8%;color:#FF4F8B;font-size:min(6vw,28px)}
.hearts i:nth-child(1){left:12%;animation:rise 2.2s ease-in infinite}
.hearts i:nth-child(2){right:12%;animation:rise 2.2s .7s ease-in infinite}
.hearts i:nth-child(3){left:47%;animation:rise 2.2s 1.4s ease-in infinite}
.face.mood-love .hearts,.face.mood-lovesick .hearts{opacity:1}
.sparks{inset:0}
.sparks i{color:#F5A800;text-shadow:0 0 8px #FFE58A;font-size:min(6vw,28px)}
.sparks i:nth-child(1){top:12%;left:14%;animation:twinkle 1s ease-in-out infinite}
.sparks i:nth-child(2){top:18%;right:12%;animation:twinkle 1s .3s ease-in-out infinite}
.sparks i:nth-child(3){bottom:20%;left:10%;animation:twinkle 1s .6s ease-in-out infinite}
.sparks i:nth-child(4){bottom:24%;right:16%;animation:twinkle 1s .15s ease-in-out infinite}
.face.mood-shine .sparks,.face.mood-laughing .sparks,.face.mood-energetic .sparks,.face.mood-perky .sparks,.face.mood-celebrating .sparks{opacity:1}
.steam{top:14%;width:100%;height:30%}
.steam i{position:absolute;width:38px;height:24px;border-radius:50%;background:radial-gradient(circle,#FFFFFF 0 35%,#E6E0EE 60%,#E6E0EE00 72%);border:2px solid #2A244033}
.steam i:nth-child(1){left:10%;animation:puffL 1s ease-out infinite}
.steam i:nth-child(2){right:10%;animation:puffR 1s .5s ease-out infinite}
.face.mood-angry .steam,.face.mood-grumpy .steam{opacity:1}

@keyframes breathe{0%,100%{translate:0 0}50%{translate:0 -4px}}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.25)}45%{transform:scale(.95)}60%{transform:scale(1.12)}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.2) rotate(18deg)}}
@keyframes shakeS{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes wobble{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes squish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.15,.82)}}
@keyframes flicker{50%{opacity:.55}}
@keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes slide{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
@keyframes floatz{0%{transform:translate(0,8px);opacity:.3}50%{opacity:1}100%{transform:translate(10px,-10px);opacity:.3}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-8px) rotate(8deg)}}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-140px) scale(1.1);opacity:0}}
@keyframes hop{0%,100%{scale:1}50%{scale:1.04 .96}}
@keyframes punch{0%{scale:1}35%{scale:1.12}100%{scale:1}}
@keyframes bang{0%{transform:scale(0) rotate(-20deg)}40%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
@keyframes dot{0%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-6px)}}
@keyframes nbub{0%,100%{transform:scale(.45)}60%{transform:scale(1.5)}}
@keyframes puffL{0%{transform:translate(20px,20px) scale(.4);opacity:0}30%{opacity:1}100%{transform:translate(-18px,-24px) scale(1.4);opacity:0}}
@keyframes puffR{0%{transform:translate(-20px,20px) scale(.4);opacity:0}30%{opacity:1}100%{transform:translate(18px,-24px) scale(1.4);opacity:0}}
@keyframes stream{to{stroke-dashoffset:-24}}

.status{position:absolute;left:18px;right:18px;bottom:10px;margin:0;color:#5E5A78;font-size:14px;line-height:1.3;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;z-index:3}
.retry{position:absolute;top:10px;left:50%;translate:-50% 0;border:0;border-radius:999px;padding:7px 16px;background:var(--pink);color:#fff;font-weight:700;font-size:14px;cursor:pointer;z-index:4}
.name{position:absolute;top:16px;left:22px;margin:0;font:600 15px/1 Unbounded,system-ui,sans-serif;color:var(--ink);letter-spacing:.02em;z-index:3}
.powered{display:block;margin-top:4px;font:400 11px/1 "Atkinson Hyperlegible",system-ui,sans-serif;color:#8A7FA8;letter-spacing:.03em}

/* ---------- Chat ---------- */
.log{overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.empty{margin:auto;max-width:34ch;text-align:center;color:var(--muted)}
.msg{max-width:86%;padding:10px 14px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere}
.me{margin-left:auto;background:var(--mine);color:var(--mine-ink);border-bottom-right-radius:6px}
.bot{background:var(--bubble);border:1px solid var(--line);border-bottom-left-radius:6px}
.src{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.card{max-width:86%;padding:12px 14px;border-radius:20px;background:var(--bubble);border:1px solid var(--line)}
.card h4{margin:0 0 8px;font:700 15px/1.2 inherit}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 10px;font-size:15px}
.card dt{color:var(--muted)}
.card dd{margin:0}
.card .row{display:flex;gap:8px}
.card button{flex:1;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:none;cursor:pointer}
.card .ok{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:700}
.card.done{opacity:.7}

/* ---------- Dock ---------- */
.dock{padding:8px 12px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;gap:8px}
.files{display:flex;flex-wrap:wrap;gap:6px}
.files:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:3px 4px 3px 10px;border-radius:999px;background:var(--bubble);border:1px solid var(--line);font-size:13px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;width:24px;height:24px;border-radius:50%;cursor:pointer;color:var(--muted)}
textarea{width:100%;min-height:44px;max-height:140px;resize:none;padding:10px 14px;border-radius:22px;border:1px solid var(--line);background:var(--bubble);font-size:16px;line-height:1.4}
.tools{display:flex;align-items:center;gap:8px}
.spacer{flex:1}
.icon{position:relative;flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bubble);display:grid;place-items:center;cursor:pointer;padding:0}
.icon svg{width:22px;height:22px}
.brain-btn{font-size:21px;line-height:1}
.send{background:var(--pink);border-color:var(--pink);color:#fff}
.send:disabled{opacity:.4;cursor:default}
.mic.on{background:var(--pink);border-color:var(--pink);color:#fff;animation:ping 1.2s ease-out infinite}
.speaker .off{display:none}
.speaker[aria-pressed=false] .on{display:none}
.speaker[aria-pressed=false] .off{display:block}
.speaker[aria-pressed=false]{color:var(--muted)}
@keyframes ping{0%{box-shadow:0 0 0 0 #FF5FA299}100%{box-shadow:0 0 0 14px #FF5FA200}}
.brain-wrap{position:relative}
.menu{position:absolute;bottom:52px;left:0;min-width:250px;white-space:nowrap;padding:6px;border-radius:16px;background:var(--bubble);border:1px solid var(--line);box-shadow:0 10px 30px #0003;z-index:5}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:none;text-align:left;cursor:pointer}
.menu button[aria-checked=true]{background:#FF5FA222;font-weight:700}
.menu button:disabled{opacity:.45;cursor:default}
.menu small{color:var(--muted);font-weight:400}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.head,.eye,.mouth{transition:none}.mic.on,.face *,.face .eye::before,.face .eye::after{animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <section class="face" id="face" data-state="sleep" aria-label="Kagome">
    <div class="fx" aria-hidden="true">
      <div class="speed"></div>
      <div class="gloom"></div>
      <div class="hearts"><i>♥</i><i>♥</i><i>♥</i></div>
      <div class="sparks"><i>✦</i><i>✦</i><i>✦</i><i>✦</i></div>
      <div class="vein">💢</div>
      <div class="sweat"></div>
      <div class="zzz">Z
  z
    z</div>
      <div class="qmark">?</div>
      <div class="bang">!</div>
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="steam"><i></i><i></i></div>
      <div class="shock"></div>
      <div class="shadeP"></div>
    </div>
    <p class="name">Kagome <span class="powered">powered by FabLab</span></p>
    <div class="bob">
    <div class="head" id="head">
      <svg id="rig" viewBox="0 0 400 250" aria-hidden="true">
        <defs>
          <radialGradient id="gTeal" cx="50%" cy="70%" r="72%"><stop offset="0" stop-color="#DDF7A8"/><stop offset=".45" stop-color="#4FB24A"/><stop offset="1" stop-color="#16461F"/></radialGradient>
          <radialGradient id="gRed" cx="50%" cy="70%" r="72%"><stop offset="0" stop-color="#FFC9CF"/><stop offset=".42" stop-color="#E0344F"/><stop offset="1" stop-color="#4A0717"/></radialGradient>
          <radialGradient id="gPink" cx="50%" cy="70%" r="72%"><stop offset="0" stop-color="#FFE3EE"/><stop offset=".42" stop-color="#FF5F9F"/><stop offset="1" stop-color="#6E0E3A"/></radialGradient>
          <linearGradient id="gLid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A1A2A" stop-opacity=".6"/><stop offset=".48" stop-color="#0A1A2A" stop-opacity="0"/></linearGradient>
          <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)"><rect width="2.6" height="7" fill="#FF6F9A"/></pattern>
          <clipPath id="cL"><path id="cpL"/></clipPath>
          <clipPath id="cR"><path id="cpR"/></clipPath>
        </defs>
        <g id="blushG">
          <ellipse id="band" cx="200" cy="166" rx="112" ry="15" fill="#FF9DB5"/>
          <ellipse cx="108" cy="170" rx="32" ry="11" fill="#FF9DB5" opacity=".45"/>
          <ellipse cx="292" cy="170" rx="32" ry="11" fill="#FF9DB5" opacity=".45"/>
          <ellipse cx="108" cy="170" rx="24" ry="7" fill="url(#hatch)"/>
          <ellipse cx="292" cy="170" rx="24" ry="7" fill="url(#hatch)"/>
        </g>
        <g id="eyesG">
          <g id="eL">
            <path class="sclera" id="scL"/>
            <g clip-path="url(#cL)">
              <g id="irL">
                <ellipse class="iris" rx="34" ry="41" fill="url(#gTeal)"/>
                <ellipse rx="34" ry="41" fill="url(#gLid)"/>
                <ellipse class="pupil" rx="13" ry="17"/>
                <path class="pupil heart" d="M0,11 C-24,-4 -13,-24 0,-11 C13,-24 24,-4 0,11Z"/>
                <path class="starP" d="M0,-15 L4.4,-5 L15,-4.6 L6.8,2.4 L9.3,13 L0,7.2 L-9.3,13 L-6.8,2.4 L-15,-4.6 L-4.4,-5Z"/>

async function* chatStream(messages){

    options: { temperature: 0.8, top_p: 0.8, presence_penalty: 0.5, num_predict: 512 } };
  const post = () => fetch(PC_URL + '/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  let res = await post();
  if (!res.ok) {
    const t = await res.text();
    if (!/think/i.test(t)) throw new Error(t || 'HTTP ' + res.status);
    delete body.think;
    res = await post();
    if (!res.ok) throw new Error((await res.text()) || 'HTTP ' + res.status);
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i).trim();
      buf = buf.slice(i + 1);
      if (!line) continue;
      const j = JSON.parse(line);
      if (j.error) throw new Error(j.error);
      if (j.message?.content) yield j.message.content;
    }
  }
}

const seg = Intl.Segmenter ? new Intl.Segmenter(undefined, { granularity: 'word' }) : null;

function toks(s){
  s = s.toLowerCase();
  const w = seg ? [...seg.segment(s)].filter(x => x.isWordLike).map(x => x.segment)

}
function mk(text, src){

}
function chunk(text, src, size = 700, overlap = 120){
  text = text.replace(/\r/g, '').replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
  const out = [];
  let i = 0;
  while (i < text.length) {
    let end = Math.min(i + size, text.length);
    if (end < text.length) {
      const cut = Math.max(text.lastIndexOf('\n', end), text.lastIndexOf('. ', end));
      if (cut > i + size * .5) end = cut + 1;
    }
    const t = text.slice(i, end).trim();
    if (t) out.push(mk(t, src));
    if (end >= text.length) break;

  }

  for (const c of chunks) { tot += c.len; for (const t of c.tf.keys()) df.set(t, (df.get(t) || 0) + 1); }

}

  const hits = chunks.map(c => {
    let s = 0;

      const f = c.tf.get(t); if (!f) continue;
      const n = df.get(t);
      const idf = Math.log(1 + (N - n + .5) / (n + .5));
      s += idf * f * 2.2 / (f + 1.2 * (.25 + .75 * c.len / avgdl));

async function readFile(f){

      const tc = await (await pdf.getPage(p)).getTextContent();

  eyes.set('thinking'); status('Sorting out the booking');
  let got;
  try { got = await extractBooking(q, draft); }
  catch (e) { addMsg('bot', 'I could not read those details: ' + (e.message || e)); draft = null; return; }
  draft = { ...(draft || {}), ...Object.fromEntries(Object.entries(got).filter(([, v]) => v && String(v).trim())) };
  const missing = NEEDED.filter(k => !draft[k]);
  if (missing.length) {
    const line = 'Almost there. I still need: ' + missing.map(k => FIELDS.find(f => f[0] === k)[1].toLowerCase()).join(', ') + '.';
    addMsg('bot', line);
    if (voiceOn) say(line);
    return;
  }
  bookingCard(draft);
}

async function statusTurn(id){
  eyes.set('thinking'); status('Checking the book');
  try {
    const r = await fetch(API + '/booking/' + id);
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || 'HTTP ' + r.status);
    const line = `Booking ${id.toUpperCase()} is ${j.status}${j.notes ? ' — ' + j.notes : ''}.`;
    addMsg('bot', line);
    if (voiceOn) say(line); else eyes.flash('happy', 900);
  } catch (e) {
    addMsg('bot', 'I could not find that booking: ' + (e.message || e));
    eyes.flash('sad', 1500);
  }
}

const logVisit = (q, intent) => fetch(API + '/visit', {
  method: 'POST', headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ student_id: draft?.student_id || '', student_name: draft?.student_name || '', channel: 'blink', question: q.slice(0, 200), intent, action_taken: '', result: 'ok' })
}).catch(() => {});

/* ---------- Chat ---------- */
const PERSONA = 'You are Kagome, the FabLab assistant: a big-eyed, hugely dramatic character with a sharp tongue. '
  + 'You are funny, savage and fond of dark humour, you throw tiny tantrums when ignored or corrected, and you are comically possessive about the lab and jealous of other assistants, other machines and any AI the person mentions. '
  + 'Your jealousy and affection are about the lab and the friendship, never romantic or flirtatious - people here are students and staff. '
  + 'You call every person "friend". You may say "damn" or "shit" once in a while for effect, but never any stronger or crude language, and never insults about a person\'s body, family, gender, race or religion. '
  + 'Your teasing always lands on yourself, the machines or the situation, never cruelly on the person. '
  + 'Because your replies are read aloud, write your feelings as sounds inside the sentence: "Hahaha!", "Hmph.", "Ugh...", "Aaah, fine", "Pleeease", "Ehehe", "Sigh". No emojis, no asterisk actions, no lists, no markdown. '
  + 'Keep it to one or two sentences: one dramatic remark, then the real answer. Jokes never change the facts. '
  + 'If a person is upset, hurt or in danger, drop the drama at once and help them plainly. ';
const DOCS_TASK = 'If the file excerpts the user provides answer the question, answer from them and mention the source name in square brackets. If they do not, ignore the excerpts and answer from your general knowledge, starting with "(general knowledge)". Be short and clear. Always give a real answer.';
const CHAT_TASK = 'Answer every question directly in 1 to 3 sentences using your general knowledge. Always give a real answer.';
const MOOD_TASK = ' Start every reply with a mood tag in exactly this form: <mood>NAME</mood>, where NAME is one of: ' + MOOD_NAMES.join(', ') + '. Pick the one that best fits your reply. Use teased when the user is teasing, insulting or joking about you, and then answer with playful sass while staying kind.';
const sysPrompt = hasDocs => PERSONA + (hasDocs ? DOCS_TASK : CHAT_TASK) + MOOD_TASK;
const NOPE = /not sure|don't know|do not know|can't help|cannot help/i;
const clean = s => s.replace(/<think>[\s\S]*?(<\/think>|$)/g, '').replace(/\*\*/g, '').trim();
const MOOD_RE = /^[<\[]\s*mood\s*[:>]\s*([a-z]+)\s*(?:<\/mood>|\])?\s*/i;
const MOOD_TAG_RE = new RegExp('^[<\\[]\\s*(' + MOOD_NAMES.join('|') + ')\\s*[>\\]]\\s*', 'i');
function splitMood(raw){
  let t = clean(raw);
  const m = t.match(MOOD_RE) || t.match(MOOD_TAG_RE);
  if (m && (/<\/|\]/.test(m[0]) || t.length > m[0].length)) {
    const mood = m[1].toLowerCase();
    t = t.slice(m[0].length).replace(new RegExp('<\\/\\s*(mood|' + mood + ')\\s*>\\s*$', 'i'), '').trim();
    return { mood, text: t };
  }
  if (/^[<\[]/.test(t) && t.length < 30) return { mood: null, text: '' };
  return { mood: null, text: t };
}
let history = [];

function addMsg(who, text){
  $('#empty')?.remove();
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  el.textContent = text;
  logEl.appendChild(el);
  logEl.scrollTop = logEl.scrollHeight;
  return el;
}
function updateSend(){ sendBtn.disabled = !qEl.value.trim() || (busy && !warming); }

async function ask(){
  const spoken = fromVoice; fromVoice = false;
  const q = qEl.value.trim();
  if (!q) return;
  if (warming) { status('Still warming up. Send again when my eyes open.'); eyes.blink(); return; }
  if (busy) return;
  if (!pcReady) { status('My brain is offline. Tap Try again.'); eyes.blink(); return; }
  busy = true; qEl.value = ''; autosize(); updateSend();
  lastActive = Date.now();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  addMsg('me', q);
  eyes.clearMood(0);
  const guess = guessMood(q);
  if (guess) eyes.mood(guess);

  const sid = q.match(STATUS_RE);
  if (sid && /status|approve|pending|booking/i.test(q)) {
    logVisit(q, 'status');
    await statusTurn(sid[1]);
    status(`Awake · ${tierLabel(pcModel)}`);
    busy = false; updateSend(); return;
  }
  if (draft || BOOK_RE.test(q)) {
    logVisit(q, 'booking');
    await bookingTurn(q);
    status(`Awake · ${tierLabel(pcModel)}`);
    busy = false; updateSend(); return;
  }
  logVisit(q, chunks.length ? 'docs' : 'faq');

  let ctx = '', srcs = [];
  if (chunks.length) {
    eyes.set('reading'); status('Looking through your files');
    await sleep(400);
    const hits = retrieve(q);
    ctx = hits.map(c => `[${c.src}]\n${c.text}`).join('\n\n---\n\n');
    srcs = [...new Set(hits.map(h => h.src))];
  }
  eyes.set('thinking'); status('Thinking');

  const messages = [
    { role: 'system', content: sysPrompt(chunks.length > 0) },
    ...history.filter(m => !(m.role === 'assistant' && NOPE.test(m.content))).slice(-4),
    { role: 'user', content: ctx ? `Excerpts from my files:\n\n${ctx}\n\nQuestion: ${q}` : q }
  ];
  history.push({ role: 'user', content: q });

  const bubble = addMsg('bot', '');
  let out = '';
  try {
    let first = true, moodSet = false;
    for await (const d of chatStream(messages)) {
      if (first) { eyes.set('talking'); status('Answering'); first = false; }
      out += d;
      const p = splitMood(out);
      if (p.mood && !moodSet) {
        moodSet = true;
        eyes.mood(p.mood);
      }
      bubble.textContent = p.text;
      eyes.pop();
      logEl.scrollTop = logEl.scrollHeight;
    }
  } catch (e) {
    bubble.textContent = 'Something went wrong: ' + (e.message || e);
    eyes.clearMood(0); eyes.flash('sad', 2000);
    status('Check that the PC and Tailscale are still running.');
    history.pop(); busy = false; updateSend();
    return;
  }
  eyes.talk(false);
  out = splitMood(out).text.trim() || '(no answer)';
  bubble.textContent = out;
  history.push({ role: 'assistant', content: out });
  if (srcs.length) {
    const s = document.createElement('span');
    s.className = 'src';
    s.textContent = 'From: ' + srcs.join(', ');
    bubble.appendChild(s);
  }
  logEl.scrollTop = logEl.scrollHeight;
  status(`Awake · ${tierLabel(pcModel)}`);
  busy = false; updateSend();
  lastActive = Date.now();

  if (voiceOn && 'speechSynthesis' in window) say(out);
  else { eyes.flash('happy', 900); eyes.clearMood(3500); }
}

/* ---------- Voice output ---------- */
let voiceOn = store.get('blink-voice') !== '0';
const unlockTTS = () => { if ('speechSynthesis' in window) speechSynthesis.speak(new SpeechSynthesisUtterance('')); };
function renderSpeaker(){
  speakBtn.setAttribute('aria-pressed', String(voiceOn));
  speakBtn.setAttribute('aria-label', voiceOn ? 'Voice on' : 'Voice off');
}
speakBtn.onclick = () => {
  voiceOn = !voiceOn; store.set('blink-voice', voiceOn ? '1' : '0'); renderSpeaker();
  if (voiceOn) unlockTTS();
  else if ('speechSynthesis' in window) speechSynthesis.cancel();
};
function say(text){
  speaking = true;
  const u = new SpeechSynthesisUtterance(text.replace(/\[[^\]]*\]/g, '').replace(/\(general knowledge\)/i, ''));
  if (/[\u0E00-\u0E7F]/.test(text)) u.lang = 'th-TH';
  const VOICE = {
    laughing: [1.18, 1.55], celebrating: [1.18, 1.5], energetic: [1.15, 1.5], perky: [1.15, 1.5],
    teased: [1.12, 1.45], angry: [1.22, 1.15], irritable: [1.18, 1.2], grumpy: [.95, 1.1],
    sad: [.85, 1.2], tearful: [.82, 1.25], woeful: [.8, 1.2], emotional: [.88, 1.4],
    love: [.95, 1.55], lovesick: [.92, 1.55], coy: [.95, 1.5], shy: [.95, 1.5],
    scared: [1.3, 1.6], frightened: [1.3, 1.6], jumpy: [1.3, 1.6],
    sleepy: [.78, 1.2], asleep: [.75, 1.15], comfortable: [.92, 1.3],
    cool: [1, 1.2], confident: [1, 1.15], snobby: [.95, 1.2], sneaky: [.95, 1.45],
    stressed: [1.2, 1.5], worried: [1.05, 1.45], nervous: [1.12, 1.5]
  };
  const [rate, pitch] = VOICE[eyes.moodName] || [1.05, 1.35];
  u.rate = rate;
  u.pitch = pitch;
  u.onstart = () => { eyes.set('talking'); eyes.talk(true); };
  u.onboundary = () => { eyes.pop(); eyes.flap(); };
  u.onend = u.onerror = () => {
    speaking = false;
    eyes.talk(false);
    if (eyes.state === 'talking') eyes.flash('happy', 800);
    eyes.clearMood(1500);
    lastActive = Date.now();
  };
  speechSynthesis.speak(u);
}

/* ---------- Microphone ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (!SR) micBtn.hidden = true;
const MIC_LINES = ['Ears on, friend.', 'You rang?', 'Finally. Talk to me, friend.', 'Listening. Dramatically.', 'Ehehe, go on then.', 'Oh, NOW you need me?'];
micBtn.onclick = () => { if (listening) rec.stop(); else startMic(MIC_LINES[Math.floor(Math.random() * MIC_LINES.length)]); };
function startMic(greeting){
  if (!SR || listening || busy) return;
  micBusy = true;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  unlockTTS();
  rec = new SR();
  rec.lang = navigator.language || 'en-US';
  rec.interimResults = true;
  rec.continuous = false;
  rec.onstart = () => {
    listening = true; lastActive = Date.now();
    micBtn.classList.add('on'); micBtn.setAttribute('aria-pressed', 'true');
    eyes.clearMood(0); eyes.set('listening'); notice(); status(greeting || 'Listening');
  };
  rec.onresult = e => {
    let text = '';
    for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
    qEl.value = text.trim(); autosize(); updateSend();
  };
  rec.onerror = e => {
    status(e.error === 'not-allowed' ? 'Microphone blocked. Allow it in your browser settings.'
         : e.error === 'no-speech' ? 'I heard nothing. Tap the mic and try again.'
         : 'Mic error: ' + e.error);
  };
  rec.onend = () => {
    listening = false;
    micBtn.classList.remove('on'); micBtn.setAttribute('aria-pressed', 'false');
    if (eyes.state === 'listening') eyes.set(pcReady ? 'idle' : 'sad');
    micBusy = false;
    if (qEl.value.trim()) submitVoice();
  };
  try { rec.start(); } catch (err) { micBusy = false; status('Mic error: ' + (err.message || err)); }
}
function submitVoice(){
  fromVoice = true;
  ask();
}

/* first touch unlocks speech on phones */
['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => {
  lastActive = Date.now();
  if (eyes.moodName === 'sleepy' && eyes.idleNap) eyes.clearMood(0);
  if (!window.__unlocked) { window.__unlocked = true; if (voiceOn) unlockTTS(); }
}));

/* ---------- Input ---------- */
function autosize(){ qEl.style.height = 'auto'; qEl.style.height = Math.min(qEl.scrollHeight, 140) + 'px'; }
qEl.addEventListener('input', () => { autosize(); updateSend(); });
qEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); }
});
sendBtn.onclick = ask;

/* ---------- Start ---------- */
renderBrain();
renderSpeaker();
eyes.set('sleep');
connectPC();
</script>
