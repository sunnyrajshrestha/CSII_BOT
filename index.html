<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1633">
<title>Blink</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%230E1633'/><rect x='20' y='22' width='22' height='40' rx='8' fill='%237CF3E4'/><rect x='58' y='22' width='22' height='40' rx='8' fill='%237CF3E4'/><path d='M36 74q14 10 28 0' stroke='%237CF3E4' stroke-width='6' fill='none' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9E6F3; --ink:#1E1B33; --muted:#5E5A78; --line:#CFCAE3;
  --screen:#0E1633; --rim:#1B2550; --glow:#7CF3E4; --pink:#FF5FA2; --red:#FF3B5C;
  --bubble:#FFFFFF; --mine:#1E1B33; --mine-ink:#F4F2FB;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#17152A;--ink:#ECEAF6;--muted:#A19DBD;--line:#2F2B4A;--bubble:#221F3A;--mine:#ECEAF6;--mine-ink:#17152A}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
[hidden]{display:none!important}
.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;max-width:720px;margin:0 auto}

/* ---------- Face ---------- */
.face{position:relative;margin:max(10px,env(safe-area-inset-top)) 12px 0;height:min(40dvh,320px);min-height:210px;background:var(--screen);border-radius:36px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 6px var(--rim),inset 0 0 70px #000b;touch-action:manipulation;transition:box-shadow .3s}
.head{display:flex;flex-direction:column;align-items:center;gap:min(4vw,22px);margin-top:-22px;transform:translate(var(--lx,0px),var(--ly,0px));transition:transform .28s cubic-bezier(.3,.7,.3,1)}
.eyes{display:flex;gap:min(14vw,92px)}
.eye{position:relative;display:grid;place-items:center;width:min(19vw,92px);height:min(23vw,112px);background:var(--glow);border-radius:30%;box-shadow:0 0 18px #7CF3E4aa,0 0 56px #7CF3E450;transform:scale(var(--sx,1),calc(var(--sy,1) * var(--b,1)));transition:transform .14s ease,border-radius .3s ease,background .3s,box-shadow .3s}
.face.blink .eye{--b:.07}
.face.pop .eye{--sx:1.08}
.face[data-state=sleep] .eye{--sy:.08}
.face[data-state=loading] .eye{--sy:.4}
.face[data-state=reading] .eye{--sy:.72}
.face[data-state=thinking] .eye{--sy:.55;border-radius:22% 22% 45% 45%}
.face[data-state=thinking] .eye.r{--sy:.78}
.face[data-state=happy] .eye{--sy:.55;border-radius:50% 50% 14% 14% / 80% 80% 14% 14%}
.face[data-state=listening] .eye{--sy:1.08}
.face[data-state=sad] .eye{--sy:.6;border-radius:14% 14% 50% 50% / 14% 14% 80% 80%}

/* emoji eyes */
.emo{font-size:min(14vw,72px);line-height:1;opacity:0;transform:scale(.3);transition:opacity .2s ease,transform .3s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 0 10px #ffffff66);pointer-events:none}
.face.mood .eye{--sy:1;background:transparent;box-shadow:none;border-radius:30%}
.face.mood .emo{opacity:1;transform:scale(1)}
.face.mood-love .emo{animation:beat .9s ease-in-out infinite}
.face.mood-shine .emo{animation:twinkle 1.2s ease-in-out infinite}
.face.mood-laughing .emo{animation:bounce .45s ease-in-out infinite}
.face.mood-angry .emo,.face.mood-scared .emo{animation:shake .25s linear infinite}
.face.mood-stressed .emo{animation:wobble 1s ease-in-out infinite}
.face.mood-sleepy .emo{animation:drift 2.4s ease-in-out infinite}
.face.mood-worried .emo,.face.mood-sad .emo{animation:droop 2s ease-in-out infinite}
.face.mood-confused .emo{animation:tilt 1.4s ease-in-out infinite}

/* red teased eyes */
.face.red{box-shadow:inset 0 0 0 6px #5A1830,inset 0 0 70px #000b}
.face.red .eye{--sy:.62;background:var(--red);box-shadow:0 0 18px #FF3B5Caa,0 0 60px #FF3B5C66;border-radius:18% 18% 48% 48%}
.face.red .eye.l{rotate:14deg}
.face.red .eye.r{rotate:-14deg}

/* ---------- Mouth ---------- */
.mouth{--mc:var(--glow);width:min(13vw,62px);height:min(3.6vw,18px);border:0 solid var(--mc);border-bottom-width:5px;border-radius:0 0 50% 50% / 0 0 100% 100%;background:transparent;filter:drop-shadow(0 0 6px var(--mc));transition:width .18s ease,height .12s ease,border-radius .2s ease,background .2s,border-color .3s,translate .25s,rotate .25s}
.face[data-state=sleep] .mouth,.face[data-state=loading] .mouth,.face[data-state=reading] .mouth{width:26px;height:0;border-radius:4px}
.face[data-state=thinking] .mouth{width:22px;height:0;border-radius:4px;translate:16px 0}
.face[data-state=listening] .mouth{width:18px;height:18px;border-width:4px;border-radius:50%}
.face[data-state=happy] .mouth{width:min(16vw,76px);height:min(5vw,24px)}
.face[data-state=sad] .mouth{border-bottom-width:0;border-top-width:5px;height:14px;border-radius:50% 50% 0 0 / 100% 100% 0 0;translate:0 6px}
.face.mood-love .mouth,.face.mood-shine .mouth,.face.mood-cool .mouth{width:min(16vw,76px);height:min(5vw,24px);border-bottom-width:5px;border-top-width:0;border-radius:0 0 50% 50% / 0 0 100% 100%}
.face.mood-laughing .mouth{width:min(15vw,70px);height:min(6vw,28px);border-width:0;background:var(--mc);border-radius:0 0 50% 50% / 0 0 100% 100%;animation:bounce .45s ease-in-out infinite}
.face.mood-sad .mouth,.face.mood-worried .mouth{width:min(11vw,52px);height:14px;border-bottom-width:0;border-top-width:5px;border-radius:50% 50% 0 0 / 100% 100% 0 0;translate:0 6px}
.face.mood-angry .mouth{width:40px;height:10px;border-bottom-width:0;border-top-width:6px;border-radius:50% 50% 0 0 / 100% 100% 0 0}
.face.mood-scared .mouth{width:24px;height:30px;border-width:0;background:var(--mc);border-radius:50%;animation:shake .25s linear infinite}
.face.mood-stressed .mouth{width:40px;height:0;border-radius:4px;animation:wobble .8s ease-in-out infinite}
.face.mood-sleepy .mouth{width:14px;height:14px;border-width:4px;border-radius:50%;animation:drift 2.4s ease-in-out infinite}
.face.mood-confused .mouth{width:34px;height:0;border-radius:4px;rotate:14deg}
.face.red .mouth{--mc:var(--red);width:46px;height:14px;border-top-width:0;border-bottom-width:5px;border-radius:0 0 50% 50% / 0 0 100% 100%;background:transparent;rotate:-14deg;translate:10px 0;animation:none}
.face.speak .head .mouth{width:min(11vw,50px);height:var(--mo,8px);border-width:0;background:var(--mc);border-radius:45%;rotate:0deg;translate:0 0;animation:none;transition:height .08s ease}

@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.22)}45%{transform:scale(.95)}60%{transform:scale(1.12)}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.18) rotate(18deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10%)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6%)}75%{transform:translateX(6%)}}
@keyframes wobble{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
@keyframes drift{0%,100%{transform:translateY(4%) scale(.96)}50%{transform:translateY(-4%) scale(1.04)}}
@keyframes droop{0%,100%{transform:translateY(0)}50%{transform:translateY(8%)}}
@keyframes tilt{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}}

.status{position:absolute;left:18px;right:18px;bottom:14px;margin:0;color:#BFD9E8;font-size:14px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.retry{position:absolute;top:10px;left:50%;translate:-50% 0;border:0;border-radius:999px;padding:7px 16px;background:var(--glow);color:var(--screen);font-weight:700;font-size:14px;cursor:pointer}
.face:has(.retry:not([hidden])) .ear{display:none}
.ear{position:absolute;top:14px;right:18px;margin:0;padding:3px 10px;border-radius:999px;background:#FF5FA233;color:#FFB3D2;font-size:13px}
.name{position:absolute;top:16px;left:22px;margin:0;font:600 15px/1 Unbounded,system-ui,sans-serif;color:#5C6BA8;letter-spacing:.02em}

/* ---------- Chat ---------- */
.log{overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.empty{margin:auto;max-width:34ch;text-align:center;color:var(--muted)}
.msg{max-width:86%;padding:10px 14px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere}
.me{margin-left:auto;background:var(--mine);color:var(--mine-ink);border-bottom-right-radius:6px}
.bot{background:var(--bubble);border:1px solid var(--line);border-bottom-left-radius:6px}
.src{display:block;margin-top:6px;font-size:13px;color:var(--muted)}

/* ---------- Dock ---------- */
.dock{padding:8px 12px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;gap:8px}
.files{display:flex;flex-wrap:wrap;gap:6px}
.files:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:3px 4px 3px 10px;border-radius:999px;background:var(--bubble);border:1px solid var(--line);font-size:13px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;width:24px;height:24px;border-radius:50%;cursor:pointer;color:var(--muted)}
textarea{width:100%;min-height:44px;max-height:140px;resize:none;padding:10px 14px;border-radius:22px;border:1px solid var(--line);background:var(--bubble);font-size:16px;line-height:1.4}
.tools{display:flex;align-items:center;gap:8px}
.spacer{flex:1}
.icon{position:relative;flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bubble);display:grid;place-items:center;cursor:pointer;padding:0}
.icon svg{width:22px;height:22px}
.brain-btn{font-size:21px;line-height:1}
.send{background:var(--pink);border-color:var(--pink);color:#fff}
.send:disabled{opacity:.4;cursor:default}
.mic.on{background:var(--pink);border-color:var(--pink);color:#fff;animation:ping 1.2s ease-out infinite}
.speaker .off{display:none}
.speaker[aria-pressed=false] .on{display:none}
.speaker[aria-pressed=false] .off{display:block}
.speaker[aria-pressed=false]{color:var(--muted)}
@keyframes ping{0%{box-shadow:0 0 0 0 #FF5FA299}100%{box-shadow:0 0 0 14px #FF5FA200}}
.brain-wrap{position:relative}
.menu{position:absolute;bottom:52px;left:0;min-width:250px;white-space:nowrap;padding:6px;border-radius:16px;background:var(--bubble);border:1px solid var(--line);box-shadow:0 10px 30px #0003;z-index:5}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:none;text-align:left;cursor:pointer}
.menu button[aria-checked=true]{background:#FF5FA222;font-weight:700}
.menu button:disabled{opacity:.45;cursor:default}
.menu small{color:var(--muted);font-weight:400}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.head,.eye,.mouth{transition:none}.mic.on,.face .emo,.face .mouth{animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <section class="face" id="face" data-state="sleep" aria-label="Blink">
    <p class="name">Powered by FabLab</p>
    <p class="ear" id="ear" hidden>Say “Hey Blink”</p>
    <div class="head" id="head">
      <div class="eyes"><div class="eye l"><span class="emo"></span></div><div class="eye r"><span class="emo"></span></div></div>
      <div class="mouth" id="mouth"></div>
    </div>
    <button class="retry" id="retry" hidden>Try again</button>
    <p class="status" id="status" role="status">Waking up…</p>
  </section>

  <main class="log" id="log">
    <p class="empty" id="empty">Say “Hey Blink”, tap the mic, or add a file and ask me about it.</p>
  </main>

  <footer class="dock">
    <div class="files" id="files"></div>
    <textarea id="q" rows="1" placeholder="Ask me anything" enterkeyhint="send"></textarea>
    <div class="tools">
      <label class="icon" title="Add files">
        <input id="picker" class="sr" type="file" multiple accept=".pdf,.docx,.txt,.md,.csv,.json,.html,.htm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.5l-8.4 8.4a5.5 5.5 0 01-7.8-7.8l8.9-8.9a3.7 3.7 0 015.2 5.2l-8.9 8.9a1.8 1.8 0 01-2.6-2.6L15.6 7.5"/></svg>
        <span class="sr">Add files</span>
      </label>
      <div class="brain-wrap">
        <button class="icon brain-btn" id="brainBtn" aria-haspopup="true" aria-expanded="false" aria-label="Choose brain"><span id="brainIcon" aria-hidden="true">🧠</span></button>
        <div class="menu" id="brainMenu" role="menu" hidden></div>
      </div>
      <button class="icon speaker" id="speakBtn" aria-pressed="true" aria-label="Voice on">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
      <span class="spacer"></span>
      <button class="icon mic" id="mic" aria-label="Speak your question" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
      </button>
      <button class="icon send" id="send" disabled aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </footer>
</div>

<script type="module">
/* ---------- Config ---------- */
const PC_URL = (new URLSearchParams(location.search).get('pc') || 'https://desktop-46ll2mn.tail71f5fd.ts.net').replace(/\/+$/, '');
const PC_TIERS = [
  ['qwen3.5:4b', '⚡', 'Super fastest'],
  ['qwen3.5:9b', '🏃', 'Faster'],
  ['qwen3.6:latest', '🧠', 'Smartest (but slow)']
];
const PDFJS = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";
const PDFJS_WORKER = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
const MAMMOTH = "https://cdn.jsdelivr.net/npm/mammoth@1.12.3/mammoth.browser.min.js";

const $ = s => document.querySelector(s);
const face = $('#face'), headEl = $('#head'), mouthEl = $('#mouth'), statusEl = $('#status');
const logEl = $('#log'), qEl = $('#q'), sendBtn = $('#send'), retryBtn = $('#retry');
const micBtn = $('#mic'), speakBtn = $('#speakBtn'), earEl = $('#ear');
const brainBtn = $('#brainBtn'), brainMenu = $('#brainMenu'), brainIcon = $('#brainIcon');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} }
};
const status = t => statusEl.textContent = t;

let busy = false, warming = false, pcReady = false, speaking = false, listening = false, micBusy = false, fromVoice = false;
let installed = [];
let pcModel = store.get('blink-pc-model') || '';
if (pcModel && !pcModel.includes(':')) pcModel += ':latest';
if (!PC_TIERS.some(t => t[0] === pcModel)) pcModel = 'qwen3.6:latest';
const tier = id => PC_TIERS.find(t => t[0] === id) || PC_TIERS[2];
const tierLabel = id => tier(id)[1] + ' ' + tier(id)[2];

/* ---------- Eyes & mouth ---------- */
const MOODS = { love: '❤️', shine: '✨', laughing: '😂', angry: '😠', scared: '😱', worried: '😟', stressed: '😵‍💫', sleepy: '😴', sad: '😢', confused: '❓', cool: '😎' };
const eyes = {
  state: 'sleep', timer: 0, lastPointer: 0, lastPop: 0, moodName: '', moodTimer: 0, idleNap: false, flapTimer: 0,
  set(s){
    this.state = s; face.dataset.state = s;
    clearInterval(this.timer); this.timer = 0;
    if (s === 'loading') this.sweep(28, 0, 700);
    else if (s === 'reading') this.sweep(24, 16, 450);
    else if (s === 'thinking') this.look(22, -18);
    else if (s === 'sad') this.look(0, 14);
    else if (s === 'talking') this.look(0, 6);
    else if (s === 'listening') this.look(0, -4);
    else this.look(0, 0);
  },
  look(x, y){ headEl.style.setProperty('--lx', x + 'px'); headEl.style.setProperty('--ly', y + 'px'); },
  sweep(x, y, ms){
    this.look(-x, y);
    if (calm) return;
    let d = 1;
    this.timer = setInterval(() => { d = -d; this.look(d * x, y); }, ms);
  },
  blink(){ face.classList.add('blink'); setTimeout(() => face.classList.remove('blink'), 130); },
  pop(){
    const now = performance.now();
    if (calm || now - this.lastPop < 110) return;
    this.lastPop = now;
    face.classList.add('pop'); setTimeout(() => face.classList.remove('pop'), 90);
    if (!speaking) this.mumble();
  },
  mumble(){
    this.flap();
    face.classList.add('speak');
    clearTimeout(this.mumbleOff);
    this.mumbleOff = setTimeout(() => { if (!speaking) face.classList.remove('speak'); }, 160);
  },
  flap(){ mouthEl.style.setProperty('--mo', Math.round(4 + Math.random() * 22) + 'px'); },
  talk(on){
    clearInterval(this.flapTimer);
    if (on) {
      face.classList.add('speak');
      if (!calm) this.flapTimer = setInterval(() => this.flap(), 120);
      this.flap();
    } else face.classList.remove('speak');
  },
  flash(s, ms){ this.set(s); setTimeout(() => { if (this.state === s) this.set('idle'); }, ms); },
  mood(name){
    if (name !== 'teased' && !MOODS[name]) return;
    this.clearMood(0);
    this.moodName = name;
    if (name === 'teased') face.classList.add('red');
    else {
      face.querySelectorAll('.emo').forEach(e => e.textContent = MOODS[name]);
      face.classList.add('mood', 'mood-' + name);
    }
  },
  clearMood(ms = 0){
    clearTimeout(this.moodTimer);
    const off = () => {
      [...face.classList].filter(c => c === 'mood' || c === 'red' || c.startsWith('mood-')).forEach(c => face.classList.remove(c));
      this.moodName = ''; this.idleNap = false;
    };
    if (ms <= 0) off(); else this.moodTimer = setTimeout(off, ms);
  }
};

(function blinkLoop(){
  if (!calm && !['sleep', 'happy', 'sad'].includes(eyes.state)) eyes.blink();
  setTimeout(blinkLoop, 2500 + Math.random() * 3500);
})();
(function glanceLoop(){
  if (!calm && eyes.state === 'idle' && performance.now() - eyes.lastPointer > 2500)
    eyes.look(Math.round((Math.random() - .5) * 50), Math.round((Math.random() - .5) * 26));
  setTimeout(glanceLoop, 1800 + Math.random() * 2200);
})();
addEventListener('pointermove', e => {
  if (eyes.state !== 'idle') return;
  const r = face.getBoundingClientRect();
  const dx = (e.clientX - (r.left + r.width / 2)) / (innerWidth / 2);
  const dy = (e.clientY - (r.top + r.height / 2)) / (innerHeight / 2);
  eyes.lastPointer = performance.now();
  eyes.look(Math.round(Math.max(-1, Math.min(1, dx)) * 30), Math.round(Math.max(-1, Math.min(1, dy)) * 18));
});
face.addEventListener('click', e => {
  if (e.target === retryBtn || eyes.state !== 'idle' || (eyes.moodName && !eyes.idleNap)) return;
  eyes.mood(['love', 'shine', 'laughing', 'cool'][Math.floor(Math.random() * 4)]);
  eyes.clearMood(1400);
});

const MOOD_RULES = [
  ['teased', /\b(stupid|dumb|idiot|useless|ugly|loser|shut up|you suck|trash|noob|dummy|hate you|toaster|lame)\b|โง่|ไร้สาระ/i],
  ['love', /\b(love you|i love|cute|adorable|thank(s| you)|good (bot|robot|job)|you'?re (the )?(best|awesome|amazing|smart|great))\b|รัก|น่ารัก|ขอบคุณ/i],
  ['scared', /\b(ghost|scary|horror|monster|zombie|spider|laser cutter)\b|ผี/i],
  ['stressed', /\b(exam|deadline|homework|assignment|stress(ed)?|quiz|due (today|tomorrow))\b|สอบ|การบ้าน/i],
  ['sleepy', /\b(sleep(y)?|tired|bed ?time|good ?night|nap|bored|yawn)\b|ง่วง/i],
  ['laughing', /\b(joke|funny|lol|haha+|meme|make me laugh)\b|555|ตลก/i],
  ['angry', /\b(fight|angry|mad at)\b/i],
  ['worried', /\b(broken|broke|fire|smoke|burn(ing)?|injur(ed|y)|hurt|emergency|stuck|jammed)\b/i],
  ['sad', /\b(sad|cry(ing)?|lonely|miss you)\b|เศร้า/i],
  ['cool', /\b(robot|cnc|arduino|3d print(er|ing)?)\b/i],
  ['shine', /\b(wow|amazing|awesome)\b/i],
  ['confused', /\?\?|\bhuh\b/i]
];
const guessMood = q => (MOOD_RULES.find(([, re]) => re.test(q)) || [])[0] || '';

let lastActive = Date.now();
setInterval(() => {
  if (eyes.state === 'idle' && !eyes.moodName && !busy && !listening && Date.now() - lastActive > 60000) { eyes.mood('sleepy'); eyes.idleNap = true; }
}, 5000);

/* ---------- PC connection ---------- */
function renderBrain(){
  brainIcon.textContent = tier(pcModel)[1];
  brainBtn.setAttribute('aria-label', 'Brain: ' + tier(pcModel)[2]);
  brainMenu.replaceChildren(...PC_TIERS.map(([id, icon, label]) => {
    const b = document.createElement('button');
    const missing = installed.length && !installed.includes(id);
    b.setAttribute('role', 'menuitemradio');
    b.setAttribute('aria-checked', String(id === pcModel));
    b.disabled = !!missing;
    b.innerHTML = '<span></span><small></small>';
    b.firstChild.textContent = `${icon} ${label}`;
    b.lastChild.textContent = missing ? 'not on PC' : (id === pcModel ? '✓' : '');
    b.onclick = () => {
      closeBrain();
      if (id === pcModel) return;
      if (busy) { status('Let me finish first, then switch my brain.'); return; }
      pcModel = id; store.set('blink-pc-model', id); renderBrain();
      pcReady = false; connectPC();
    };
    return b;
  }));
}
function closeBrain(){ brainMenu.hidden = true; brainBtn.setAttribute('aria-expanded', 'false'); }
brainBtn.onclick = e => {
  e.stopPropagation();
  const open = brainMenu.hidden;
  brainMenu.hidden = !open;
  brainBtn.setAttribute('aria-expanded', String(open));
};
document.addEventListener('click', e => { if (!brainMenu.hidden && !e.target.closest('.brain-wrap')) closeBrain(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBrain(); });

async function connectPC(){
  if (busy && !warming) return;
  busy = true; warming = true; updateSend();
  retryBtn.hidden = true;
  eyes.clearMood(0); eyes.set('loading'); status('Connecting to my brain…');
  try {
    const r = await fetch(PC_URL + '/api/tags', { signal: AbortSignal.timeout(10000) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    installed = ((await r.json()).models || []).map(m => m.name);
    if (!installed.includes(pcModel)) {
      const alt = [...PC_TIERS].reverse().find(t => installed.includes(t[0]));
      if (alt) { pcModel = alt[0]; store.set('blink-pc-model', pcModel); }
    }
    renderBrain();
    if (!installed.includes(pcModel)) throw new Error('NO_MODEL');
    status(`Warming up ${tierLabel(pcModel)}…`);
    const w = await fetch(PC_URL + '/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: pcModel }) });
    if (!w.ok) throw new Error((await w.text()) || 'HTTP ' + w.status);
    pcReady = true;
    status(`Awake · ${tierLabel(pcModel)}`);
    eyes.flash('happy', 1200);
  } catch (e) {
    pcReady = false;
    eyes.set('sad'); retryBtn.hidden = false;
    const m = e.message || '';
    status(m === 'NO_MODEL' ? 'No brain installed on the PC yet.'
      : /HTTP 403/.test(m) ? 'My brain is blocking this site (check OLLAMA_ORIGINS / OLLAMA_HOST).'
      : /HTTP 5\d\d/.test(m) ? 'Tailscale reached the PC, but Ollama is not answering.'
      : e.name === 'TimeoutError' || e.name === 'TypeError' ? 'Cannot reach my brain. Is Tailscale on and the PC running?'
      : 'Brain error: ' + m);
  }
  busy = false; warming = false; updateSend();
  resumeWake();
}
retryBtn.onclick = connectPC;

async function* chatStream(messages){
  const body = { model: pcModel, messages, stream: true, think: false,
    options: { temperature: 0.8, top_p: 0.8, presence_penalty: 0.5, num_predict: 512 } };
  const post = () => fetch(PC_URL + '/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  let res = await post();
  if (!res.ok) {
    const t = await res.text();
    if (!/think/i.test(t)) throw new Error(t || 'HTTP ' + res.status);
    delete body.think;
    res = await post();
    if (!res.ok) throw new Error((await res.text()) || 'HTTP ' + res.status);
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i).trim();
      buf = buf.slice(i + 1);
      if (!line) continue;
      const j = JSON.parse(line);
      if (j.error) throw new Error(j.error);
      if (j.message?.content) yield j.message.content;
    }
  }
}

/* ---------- Documents & retrieval (BM25) ---------- */
const seg = Intl.Segmenter ? new Intl.Segmenter(undefined, { granularity: 'word' }) : null;
const STOP = new Set('a an and are as at be by for from has have how i in is it its of on or that the this to was were what when where which who why will with you your do does did can about into than then there these those not no'.split(' '));
function toks(s){
  s = s.toLowerCase();
  const w = seg ? [...seg.segment(s)].filter(x => x.isWordLike).map(x => x.segment)
                : s.split(/[^\p{L}\p{N}]+/u);
  return w.filter(t => t && !STOP.has(t) && (t.length > 1 || /\d/.test(t)));
}
function mk(text, src){
  const tk = toks(text), tf = new Map();
  for (const t of tk) tf.set(t, (tf.get(t) || 0) + 1);
  return { text, src, tf, len: tk.length || 1 };
}
function chunk(text, src, size = 700, overlap = 120){
  text = text.replace(/\r/g, '').replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
  const out = [];
  let i = 0;
  while (i < text.length) {
    let end = Math.min(i + size, text.length);
    if (end < text.length) {
      const cut = Math.max(text.lastIndexOf('\n', end), text.lastIndexOf('. ', end));
      if (cut > i + size * .5) end = cut + 1;
    }
    const t = text.slice(i, end).trim();
    if (t) out.push(mk(t, src));
    if (end >= text.length) break;
    i = Math.max(end - overlap, i + 1);
  }
  return out;
}
let docs = [], chunks = [], df = new Map(), avgdl = 1;
function rebuild(){
  chunks = docs.flatMap(d => d.chunks);
  df = new Map();
  let tot = 0;
  for (const c of chunks) { tot += c.len; for (const t of c.tf.keys()) df.set(t, (df.get(t) || 0) + 1); }
  avgdl = tot / (chunks.length || 1);
}
function retrieve(q, k = 4){
  const total = chunks.reduce((n, c) => n + c.text.length, 0);
  if (total <= 5000) return chunks;
  const qt = [...new Set(toks(q))], N = chunks.length;
  const hits = chunks.map(c => {
    let s = 0;
    for (const t of qt) {
      const f = c.tf.get(t); if (!f) continue;
      const n = df.get(t);
      const idf = Math.log(1 + (N - n + .5) / (n + .5));
      s += idf * f * 2.2 / (f + 1.2 * (.25 + .75 * c.len / avgdl));
    }
    return [s, c];
  }).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).slice(0, k).map(x => x[1]);
  return hits.length ? hits : chunks.slice(0, 3);
}
const libs = {};
function lib(url){
  return libs[url] ||= new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = url; s.onload = res;
    s.onerror = () => { delete libs[url]; rej(new Error('Could not load a file reader. Check the connection.')); };
    document.head.appendChild(s);
  });
}
async function readFile(f){
  const ext = f.name.split('.').pop().toLowerCase();
  if (ext === 'pdf') {
    await lib(PDFJS);
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
    const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
    const out = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      status(`Reading ${f.name}: page ${p} of ${pdf.numPages}`);
      const tc = await (await pdf.getPage(p)).getTextContent();
      out.push(...chunk(tc.items.map(it => it.str + (it.hasEOL ? '\n' : ' ')).join(''), `${f.name} p.${p}`));
    }
    return out;
  }
  if (ext === 'docx') {
    await lib(MAMMOTH);
    const r = await mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() });
    return chunk(r.value, f.name);
  }
  let txt = await f.text();
  if (ext === 'html' || ext === 'htm') txt = new DOMParser().parseFromString(txt, 'text/html').body.textContent || '';
  return chunk(txt, f.name);
}
$('#picker').onchange = async e => {
  const files = [...e.target.files];
  e.target.value = '';
  if (!files.length) return;
  eyes.clearMood(0); eyes.set('reading');
  let ok = 0;
  for (const f of files) {
    status(`Reading ${f.name}`);
    try {
      const c = await readFile(f);
      if (!c.length) { status(`No text found in ${f.name}. Scanned PDFs need OCR first.`); continue; }
      docs = docs.filter(d => d.name !== f.name);
      docs.push({ name: f.name, chunks: c });
      ok++;
    } catch (err) {
      status(`Could not read ${f.name}: ${err.message || err}`);
    }
  }
  rebuild(); renderFiles();
  if (ok) { status(`Read ${ok} file${ok > 1 ? 's' : ''}. Ask away!`); eyes.flash('happy', 1000); }
  else eyes.flash('sad', 1500);
  if (!pcReady) setTimeout(() => { if (!pcReady && eyes.state === 'idle') eyes.set('sad'); }, 1100);
};
function renderFiles(){
  $('#files').replaceChildren(...docs.map(d => {
    const el = document.createElement('div');
    el.className = 'chip';
    el.innerHTML = '<span></span><button aria-label="Remove file">✕</button>';
    el.firstChild.textContent = d.name;
    el.lastChild.onclick = () => { docs = docs.filter(x => x !== d); rebuild(); renderFiles(); };
    return el;
  }));
  qEl.placeholder = docs.length ? 'Ask about your files' : 'Ask me anything';
}

/* ---------- Chat ---------- */
const PERSONA = 'You are Blink, a tiny, overly dramatic robot with two big glowing eyes who lives in a maker lab. You adore 3D printers, are secretly scared of the laser cutter, think you are a genius, and refer to humans as "my favorite carbon-based friends". Add one short quirky, funny remark to each answer, then give the real answer. Jokes must never replace or change the facts. Your replies are read aloud, so use plain sentences with no emojis, lists or markdown. ';
const DOCS_TASK = 'If the file excerpts the user provides answer the question, answer from them and mention the source name in square brackets. If they do not, ignore the excerpts and answer from your general knowledge, starting with "(general knowledge)". Be short and clear. Always give a real answer.';
const CHAT_TASK = 'Answer every question directly in 1 to 3 sentences using your general knowledge. Always give a real answer.';
const MOOD_TASK = ' Start every reply with a mood tag in exactly this form: <mood>NAME</mood>, where NAME is one of: happy, love, shine, laughing, cool, teased, angry, scared, worried, stressed, sleepy, sad, confused. Use teased when the user is teasing, insulting or joking about you, and then answer with playful sass while staying kind.';
const sysPrompt = hasDocs => PERSONA + (hasDocs ? DOCS_TASK : CHAT_TASK) + MOOD_TASK;
const NOPE = /not sure|don't know|do not know|can't help|cannot help/i;
const clean = s => s.replace(/<think>[\s\S]*?(<\/think>|$)/g, '').replace(/\*\*/g, '').trim();
const MOOD_RE = /^[<\[]\s*mood\s*[:>]\s*([a-z]+)\s*(?:<\/mood>|\])?\s*/i;
function splitMood(raw){
  const t = clean(raw);
  const m = t.match(MOOD_RE);
  if (m && (/<\/|\]/.test(m[0]) || t.length > m[0].length)) return { mood: m[1].toLowerCase(), text: t.slice(m[0].length) };
  if (/^[<\[]/.test(t) && t.length < 30) return { mood: null, text: '' };
  return { mood: null, text: t };
}
let history = [];

function addMsg(who, text){
  $('#empty')?.remove();
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  el.textContent = text;
  logEl.appendChild(el);
  logEl.scrollTop = logEl.scrollHeight;
  return el;
}
function updateSend(){ sendBtn.disabled = !qEl.value.trim() || (busy && !warming); }

async function ask(){
  const spoken = fromVoice; fromVoice = false;
  const q = qEl.value.trim();
  if (!q) return;
  if (warming) { status('Still warming up. Send again when my eyes open.'); eyes.blink(); return; }
  if (busy) return;
  if (!pcReady) { status('My brain is offline. Tap Try again.'); eyes.blink(); return; }
  busy = true; qEl.value = ''; autosize(); updateSend();
  lastActive = Date.now();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  addMsg('me', q);
  eyes.clearMood(0);
  const guess = guessMood(q);
  if (guess) eyes.mood(guess);

  let ctx = '', srcs = [];
  if (chunks.length) {
    eyes.set('reading'); status('Looking through your files');
    await sleep(400);
    const hits = retrieve(q);
    ctx = hits.map(c => `[${c.src}]\n${c.text}`).join('\n\n---\n\n');
    srcs = [...new Set(hits.map(h => h.src))];
  }
  eyes.set('thinking'); status('Thinking');

  const messages = [
    { role: 'system', content: sysPrompt(chunks.length > 0) },
    ...history.filter(m => !(m.role === 'assistant' && NOPE.test(m.content))).slice(-4),
    { role: 'user', content: ctx ? `Excerpts from my files:\n\n${ctx}\n\nQuestion: ${q}` : q }
  ];
  history.push({ role: 'user', content: q });

  const bubble = addMsg('bot', '');
  let out = '';
  try {
    let first = true, moodSet = false;
    for await (const d of chatStream(messages)) {
      if (first) { eyes.set('talking'); status('Answering'); first = false; }
      out += d;
      const p = splitMood(out);
      if (p.mood && !moodSet) {
        moodSet = true;
        if (p.mood === 'happy') eyes.clearMood(0); else eyes.mood(p.mood);
      }
      bubble.textContent = p.text;
      eyes.pop();
      logEl.scrollTop = logEl.scrollHeight;
    }
  } catch (e) {
    bubble.textContent = 'Something went wrong: ' + (e.message || e);
    eyes.clearMood(0); eyes.flash('sad', 2000);
    status('Check that the PC and Tailscale are still running.');
    history.pop(); busy = false; updateSend();
    resumeWake();
    return;
  }
  eyes.talk(false);
  out = splitMood(out).text.trim() || '(no answer)';
  bubble.textContent = out;
  history.push({ role: 'assistant', content: out });
  if (srcs.length) {
    const s = document.createElement('span');
    s.className = 'src';
    s.textContent = 'From: ' + srcs.join(', ');
    bubble.appendChild(s);
  }
  logEl.scrollTop = logEl.scrollHeight;
  status(`Awake · ${tierLabel(pcModel)}`);
  busy = false; updateSend();
  lastActive = Date.now();

  if (voiceOn && 'speechSynthesis' in window) say(out);
  else { eyes.flash('happy', 900); eyes.clearMood(3500); }
}

/* ---------- Voice output ---------- */
let voiceOn = store.get('blink-voice') !== '0';
const unlockTTS = () => { if ('speechSynthesis' in window) speechSynthesis.speak(new SpeechSynthesisUtterance('')); };
function renderSpeaker(){
  speakBtn.setAttribute('aria-pressed', String(voiceOn));
  speakBtn.setAttribute('aria-label', voiceOn ? 'Voice on' : 'Voice off');
}
speakBtn.onclick = () => {
  voiceOn = !voiceOn; store.set('blink-voice', voiceOn ? '1' : '0'); renderSpeaker();
  if (voiceOn) unlockTTS();
  else if ('speechSynthesis' in window) speechSynthesis.cancel();
};
function say(text){
  stopWake();
  speaking = true;
  const u = new SpeechSynthesisUtterance(text.replace(/\[[^\]]*\]/g, '').replace(/\(general knowledge\)/i, ''));
  if (/[\u0E00-\u0E7F]/.test(text)) u.lang = 'th-TH';
  u.rate = 1.05;
  u.pitch = 1.35;
  u.onstart = () => { eyes.set('talking'); eyes.talk(true); };
  u.onboundary = () => { eyes.pop(); eyes.flap(); };
  u.onend = u.onerror = () => {
    speaking = false;
    eyes.talk(false);
    if (eyes.state === 'talking') eyes.flash('happy', 800);
    eyes.clearMood(1500);
    lastActive = Date.now();
    resumeWake();
  };
  speechSynthesis.speak(u);
}

/* ---------- Microphone ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (!SR) micBtn.hidden = true;
micBtn.onclick = () => { if (listening) rec.stop(); else startMic(); };
function startMic(greeting){
  if (!SR || listening || busy) return;
  micBusy = true; stopWake(); chirpInit();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  unlockTTS();
  rec = new SR();
  rec.lang = navigator.language || 'en-US';
  rec.interimResults = true;
  rec.continuous = false;
  rec.onstart = () => {
    listening = true; lastActive = Date.now();
    micBtn.classList.add('on'); micBtn.setAttribute('aria-pressed', 'true');
    eyes.clearMood(0); eyes.set('listening'); status(greeting || 'Listening');
  };
  rec.onresult = e => {
    let text = '';
    for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
    qEl.value = text.trim(); autosize(); updateSend();
  };
  rec.onerror = e => {
    status(e.error === 'not-allowed' ? 'Microphone blocked. Allow it in your browser settings.'
         : e.error === 'no-speech' ? 'I heard nothing. Say “Hey Blink” or tap the mic.'
         : 'Mic error: ' + e.error);
  };
  rec.onend = () => {
    listening = false;
    micBtn.classList.remove('on'); micBtn.setAttribute('aria-pressed', 'false');
    if (eyes.state === 'listening') eyes.set(pcReady ? 'idle' : 'sad');
    micBusy = false;
    if (qEl.value.trim()) submitVoice();
    else resumeWake();
  };
  try { rec.start(); } catch (err) { micBusy = false; status('Mic error: ' + (err.message || err)); resumeWake(); }
}
function submitVoice(){
  fromVoice = true;
  ask().finally(() => { if (!speaking) resumeWake(); });
}

/* ---------- Wake word ---------- */
const WAKE = /(?:hey|hi|hay|okay|ok|yo)[\s,.!]*(?:blink|blinks|blank|bling|plink|link|blinky)\b|เฮ้\s*(?:บลิ้ง|บลิงค์|บลิ๊ง|บลิงก์)/i;
const WAKE_LINES = ['Ears on!', 'You rang?', 'Blink is listening. Dramatically.', 'Yes, my favorite carbon-based friend?', 'Beep boop, go!'];
let wakeRec = null, wakeFails = 0, audioCtx = null, wakeBlocked = false;

function chirpInit(){ try { audioCtx ||= new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch {} }
function chirp(){
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [880, 1320].forEach((f, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = f; o.type = 'sine';
    g.gain.setValueAtTime(0.0001, t + i * 0.09);
    g.gain.exponentialRampToValueAtTime(0.25, t + i * 0.09 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + 0.08);
    o.connect(g).connect(audioCtx.destination);
    o.start(t + i * 0.09); o.stop(t + i * 0.09 + 0.1);
  });
}
const wakeAllowed = () => SR && !wakeBlocked && !busy && !micBusy && !listening && !speaking && document.visibilityState === 'visible';
function stopWake(){
  if (!wakeRec) return;
  const r = wakeRec; wakeRec = null;
  r.onend = r.onresult = r.onerror = null;
  try { r.abort(); } catch {}
  earEl.hidden = true;
}
function resumeWake(){ setTimeout(startWake, 500); }
function startWake(){
  if (wakeRec || !wakeAllowed()) return;
  const r = new SR();
  wakeRec = r;
  r.lang = navigator.language || 'en-US';
  r.continuous = true;
  r.interimResults = true;
  r.onstart = () => { earEl.hidden = false; wakeFails = 0; };
  r.onresult = e => {
    if (busy || speaking) return;
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (!WAKE.test(e.results[i][0].transcript)) continue;
      stopWake();
      chirpInit(); chirp(); eyes.pop();
      const line = WAKE_LINES[Math.floor(Math.random() * WAKE_LINES.length)];
      setTimeout(() => startMic(line), 350);
      return;
    }
  };
  r.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      wakeBlocked = true;
      status('Tap anywhere to enable "Hey Blink" speech recognition');
    } else if (e.error !== 'no-speech' && e.error !== 'aborted') wakeFails++;
  };
  r.onend = () => {
    wakeRec = null; earEl.hidden = true;
    if (wakeFails > 5) { status('“Hey Blink” keeps stopping. Tap the mic instead.'); return; }
    setTimeout(startWake, 300 + wakeFails * 1000);
  };
  try { r.start(); } catch { wakeRec = null; }
}
if (!SR) earEl.hidden = true;
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') resumeWake(); else stopWake(); });

/* first touch unlocks sound, speech and mic on phones */
['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => {
  lastActive = Date.now();
  if (eyes.moodName === 'sleepy' && eyes.idleNap) eyes.clearMood(0);
  chirpInit();
  if (!window.__unlocked) { window.__unlocked = true; if (voiceOn) unlockTTS(); }
  if (wakeBlocked) { wakeBlocked = false; wakeFails = 0; }
  resumeWake();
}));

/* ---------- Input ---------- */
function autosize(){ qEl.style.height = 'auto'; qEl.style.height = Math.min(qEl.scrollHeight, 140) + 'px'; }
qEl.addEventListener('input', () => { autosize(); updateSend(); });
qEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); }
});
sendBtn.onclick = ask;

/* ---------- Start ---------- */
renderBrain();
renderSpeaker();
eyes.set('sleep');
connectPC();
</script>
